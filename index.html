<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Makeup App - Mid-Fidelity Prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #2a2a2a;
            padding: 20px;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #aaa;
            font-size: 14px;
        }

        .concept-selector {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .concept-btn {
            padding: 12px 24px;
            background: #3a3a3a;
            color: #fff;
            border: 2px solid #4a4a4a;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 600;
        }

        .concept-btn:hover {
            background: #4a4a4a;
            border-color: #ff8fa3;
        }

        .concept-btn.active {
            background: #ff8fa3;
            border-color: #ff8fa3;
            color: white;
        }

        .prototype-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            padding: 20px;
        }

        .mobile-screen {
            width: 320px;
            height: 640px;
            background: white;
            border-radius: 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .mobile-screen:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }

        .screen-label {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            z-index: 100;
        }

        .hidden {
            display: none !important;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            margin-bottom: 20px;
        }

        .back-arrow {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #666;
            font-size: 24px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .back-arrow:hover {
            background: #f0f0f0;
            color: #ff8fa3;
        }

        .screen-title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            text-align: center;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .subtitle {
            font-size: 14px;
            color: #999;
            text-align: center;
            margin-bottom: 24px;
        }

        /* Cards */
        .card {
            background: #fafafa;
            border: 2px solid #e5e5e5;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card:hover {
            border-color: #ffb3c1;
            transform: translateX(4px);
        }

        .card.selected {
            border-color: #ff8fa3;
            background: #fff5f7;
            box-shadow: 0 2px 8px rgba(255, 143, 163, 0.2);
        }

        .face-thumbnail {
            width: 52px;
            height: 52px;
            background: #e8e8e8;
            border-radius: 50%;
            flex-shrink: 0;
            position: relative;
        }

        .face-thumbnail::before {
            content: '';
            position: absolute;
            width: 9px;
            height: 9px;
            background: #bbb;
            border-radius: 50%;
            top: 17px;
            left: 13px;
        }

        .face-thumbnail::after {
            content: '';
            position: absolute;
            width: 9px;
            height: 9px;
            background: #bbb;
            border-radius: 50%;
            top: 17px;
            right: 13px;
        }

        .card-content {
            flex: 1;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .card-meta {
            font-size: 13px;
            color: #999;
        }

        .stars {
            color: #ffb347;
            margin-left: 4px;
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: #ff8fa3;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: #ff6b85;
            transform: scale(1.02);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-outline {
            padding: 14px 28px;
            background: transparent;
            color: #666;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-outline:hover {
            border-color: #ff8fa3;
            color: #ff8fa3;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        /* AR Camera */
        .ar-camera {
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, #f5f5f5 0%, #e5e5e5 100%);
            border-radius: 20px;
            margin: 20px 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .ar-face {
            width: 150px;
            height: 190px;
            background: #e8e8e8;
            border-radius: 50% 50% 45% 45%;
            position: relative;
        }

        .ar-face::before {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background: #ccc;
            border-radius: 50%;
            top: 65px;
            left: 42px;
        }

        .ar-face::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background: #ccc;
            border-radius: 50%;
            top: 65px;
            right: 42px;
        }

        .ar-highlight {
            position: absolute;
            border: 3px solid #ff8fa3;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 143, 163, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        .instruction-text {
            text-align: center;
            font-size: 14px;
            color: #666;
            padding: 0 20px;
            line-height: 1.5;
            margin: 12px 0;
        }

        /* Progress Bar */
        .progress-container {
            margin: 16px 0 24px 0;
        }

        .progress-bar {
            display: flex;
            gap: 5px;
            height: 5px;
        }

        .progress-segment {
            flex: 1;
            background: #e5e5e5;
            border-radius: 3px;
            transition: all 0.3s;
        }

        .progress-segment.active {
            background: #ff8fa3;
        }

        .progress-label {
            text-align: center;
            font-size: 13px;
            color: #999;
            margin-top: 10px;
        }

        /* Mood Grid */
        .mood-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 24px 0;
        }

        .mood-card {
            background: #fafafa;
            border: 2px solid #e5e5e5;
            border-radius: 14px;
            padding: 28px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mood-card:hover {
            border-color: #ffb3c1;
            transform: scale(1.05);
        }

        .mood-card.selected {
            border-color: #ff8fa3;
            background: #fff5f7;
            box-shadow: 0 4px 12px rgba(255, 143, 163, 0.2);
        }

        .mood-icon {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .mood-label {
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }

        /* Carousel */
        .carousel-item {
            background: #fafafa;
            border-radius: 18px;
            padding: 18px;
            margin: 20px 0;
        }

        .carousel-preview {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #f8f8f8 0%, #e8e8e8 100%);
            border-radius: 14px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .color-swatches {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            justify-content: center;
        }

        .swatch {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 3px solid #ddd;
            cursor: pointer;
            transition: all 0.2s;
        }

        .swatch:hover {
            transform: scale(1.1);
        }

        .swatch.pink { background: #ffb3ba; }
        .swatch.peach { background: #ffdfba; }
        .swatch.lavender { background: #e0bbe4; }

        .swatch.selected {
            border-color: #ff8fa3;
            box-shadow: 0 0 10px rgba(255, 143, 163, 0.5);
        }

        .look-name {
            text-align: center;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 12px;
            color: #333;
        }

        /* Color Selector Vertical */
        .color-selector-vertical {
            position: absolute;
            right: 28px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid #ddd;
            cursor: pointer;
            transition: all 0.2s;
        }

        .color-option:hover {
            transform: scale(1.15);
        }

        .color-option.selected {
            border-color: #ff8fa3;
            box-shadow: 0 0 14px rgba(255, 143, 163, 0.7);
            border-width: 4px;
        }

        /* Before/After */
        .before-after {
            text-align: center;
            margin: 30px 0;
        }

        .completion-text {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .completion-subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 28px;
        }

        .before-after-image {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #f8f8f8 0%, #e8e8e8 100%);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .overlay-hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #999;
            background: rgba(255,255,255,0.95);
            padding: 6px 10px;
            border-radius: 6px;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        /* Issue Cards */
        .issue-list {
            margin: 20px 0;
        }

        .issue-card {
            background: #fff5f7;
            border-left: 4px solid #ff6b85;
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        /* Slider */
        .slider-container {
            margin: 28px 0;
        }

        .slider-label {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 14px;
            font-weight: 600;
        }

        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .slider-text {
            font-size: 12px;
            color: #999;
            font-weight: 600;
        }

        input[type="range"] {
            flex: 1;
            height: 7px;
            border-radius: 4px;
            background: #e5e5e5;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #ff8fa3;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #ff8fa3;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        /* Capture Button */
        .capture-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 28px;
        }

        .capture-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: white;
            border: 7px solid #ff8fa3;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .capture-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 58px;
            height: 58px;
            background: #ff8fa3;
            border-radius: 50%;
        }

        .capture-button:hover {
            transform: scale(1.08);
            box-shadow: 0 4px 12px rgba(255, 143, 163, 0.4);
        }

        .capture-button:active {
            transform: scale(0.95);
        }

        .capture-label {
            margin-top: 14px;
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }

        .hint-text {
            text-align: center;
            font-size: 13px;
            color: #999;
            margin-top: 18px;
        }

        /* Analysis Photo */
        .analysis-photo {
            width: 100%;
            height: 220px;
            background: linear-gradient(135deg, #f5f5f5 0%, #e5e5e5 100%);
            border-radius: 18px;
            margin: 20px 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .marker {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ff4444;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            animation: markerPulse 1.5s infinite;
        }

        @keyframes markerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .marker1 { top: 65px; left: 60px; }
        .marker2 { top: 85px; right: 80px; }
        .marker3 { top: 130px; left: 90px; }

        .bottom-fixed {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .prototype-container {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }

            .mobile-screen {
                width: 100%;
                max-width: 360px;
            }
        }

        /* Navigation dots */
        .nav-dots {
            text-align: center;
            margin: 20px 0;
        }

        .nav-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ddd;
            border-radius: 50%;
            margin: 0 4px;
            transition: all 0.3s;
        }

        .nav-dot.active {
            background: #ff8fa3;
            width: 24px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Interactive Makeup App Prototype</h1>
            <p>Mid-Fidelity Mobile UI • Click elements to interact</p>
        </div>

        <div class="concept-selector">
            <button class="concept-btn active" onclick="showConcept('A')">Concept A: AR Tutor</button>
            <button class="concept-btn" onclick="showConcept('B')">Concept B: Mood-Driven</button>
            <button class="concept-btn" onclick="showConcept('C')">Concept C: AI Doctor</button>
        </div>

        <div class="prototype-container" id="prototype">
            <!-- Screens will be rendered here by JavaScript -->
        </div>
    </div>

    <script>
        // App State
        let currentConcept = 'A';
        let currentStep = 1;
        let selectedLook = 'Date Look';
        let selectedMood = 'Cute';
        let selectedColor = 0;
        let capturedPhoto = false;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            showConcept('A');
        });

        function showConcept(concept) {
            currentConcept = concept;
            currentStep = 1;

            // Update buttons
            document.querySelectorAll('.concept-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            renderScreens();
        }

        function renderScreens() {
            const container = document.getElementById('prototype');

            if (currentConcept === 'A') {
                container.innerHTML = renderConceptA();
            } else if (currentConcept === 'B') {
                container.innerHTML = renderConceptB();
            } else if (currentConcept === 'C') {
                container.innerHTML = renderConceptC();
            }

            attachEventListeners();
        }

        function renderConceptA() {
            if (currentStep === 1) {
                return `
                    <div class="mobile-screen">
                        <div class="screen-label">A1</div>
                        <div class="screen-title">Today's Makeup</div>
                        <div class="subtitle">Choose a look to start</div>

                        <div class="card ${selectedLook === 'Date Look' ? 'selected' : ''}" onclick="selectLook('Date Look')">
                            <div class="face-thumbnail"></div>
                            <div class="card-content">
                                <div class="card-title">Date Look</div>
                                <div class="card-meta">7 min <span class="stars">★★☆</span></div>
                            </div>
                        </div>

                        <div class="card ${selectedLook === 'School Look' ? 'selected' : ''}" onclick="selectLook('School Look')">
                            <div class="face-thumbnail"></div>
                            <div class="card-content">
                                <div class="card-title">School Look</div>
                                <div class="card-meta">10 min <span class="stars">★★★</span></div>
                            </div>
                        </div>

                        <div class="card ${selectedLook === 'Interview Look' ? 'selected' : ''}" onclick="selectLook('Interview Look')">
                            <div class="face-thumbnail"></div>
                            <div class="card-content">
                                <div class="card-title">Interview Look</div>
                                <div class="card-meta">12 min <span class="stars">★★★</span></div>
                            </div>
                        </div>

                        <div style="margin-top: auto;">
                            <button class="btn-primary" onclick="nextStep()">Start Tutorial</button>
                        </div>
                    </div>

                    <div class="mobile-screen" style="opacity: 0.3;">
                        <div class="screen-label">A2</div>
                        <div style="text-align: center; padding-top: 280px; color: #999;">
                            Click "Start Tutorial" to continue
                        </div>
                    </div>

                    <div class="mobile-screen" style="opacity: 0.3;">
                        <div class="screen-label">A3</div>
                        <div style="text-align: center; padding-top: 280px; color: #999;">
                            Complete tutorial to see result
                        </div>
                    </div>
                `;
            } else if (currentStep === 2) {
                return `
                    <div class="mobile-screen" style="opacity: 0.3;">
                        <div class="screen-label">A1</div>
                    </div>

                    <div class="mobile-screen">
                        <div class="screen-label">A2</div>
                        <div class="top-bar">
                            <div class="back-arrow" onclick="prevStep()">←</div>
                            <div style="flex:1; text-align:center; font-size:15px; font-weight:600;">Step 1 of 8</div>
                            <div style="font-size:12px; color:#999;">Foundation</div>
                        </div>

                        <div class="progress-container">
                            <div class="progress-bar">
                                <div class="progress-segment active"></div>
                                <div class="progress-segment"></div>
                                <div class="progress-segment"></div>
                                <div class="progress-segment"></div>
                                <div class="progress-segment"></div>
                                <div class="progress-segment"></div>
                                <div class="progress-segment"></div>
                                <div class="progress-segment"></div>
                            </div>
                        </div>

                        <div class="ar-camera">
                            <div class="ar-face">
                                <div class="ar-highlight" style="width:130px; height:110px; top:85px; left:10px;"></div>
                            </div>
                        </div>

                        <div class="instruction-text">
                            Apply foundation evenly on the highlighted area.
                        </div>

                        <div class="bottom-fixed">
                            <div class="button-group">
                                <button class="btn-outline" onclick="prevStep()">Back</button>
                                <button class="btn-primary" onclick="nextStep()" style="flex:1;">Next</button>
                            </div>
                        </div>
                    </div>

                    <div class="mobile-screen" style="opacity: 0.3;">
                        <div class="screen-label">A3</div>
                        <div style="text-align: center; padding-top: 280px; color: #999;">
                            Complete all steps to see result
                        </div>
                    </div>
                `;
            } else if (currentStep === 3) {
                return `
                    <div class="mobile-screen" style="opacity: 0.3;">
                        <div class="screen-label">A1</div>
                    </div>

                    <div class="mobile-screen" style="opacity: 0.3;">
                        <div class="screen-label">A2</div>
                    </div>

                    <div class="mobile-screen">
                        <div class="screen-label">A3</div>
                        <div class="before-after">
                            <div class="completion-text">Great job!</div>
                            <div class="completion-subtitle">You completed today's look.</div>

                            <div class="before-after-image" id="beforeAfter">
                                <div class="ar-face" style="width:130px; height:160px;"></div>
                                <div class="overlay-hint">Long press to see Before/After</div>
                            </div>
                        </div>

                        <div class="bottom-fixed">
                            <button class="btn-primary" style="margin-bottom:12px;" onclick="alert('Look saved!')">Save Look</button>
                            <button class="btn-outline" style="width:100%; margin-bottom:8px;" onclick="currentStep = 1; renderScreens();">Restart</button>
                            <div style="text-align:center; color:#999; font-size:14px; cursor:pointer; padding:10px;" onclick="currentStep = 1; renderScreens();">Exit</div>
                        </div>
                    </div>
                `;
            }
        }

        function renderConceptB() {
            if (currentStep === 1) {
                return `
                    <div class="mobile-screen">
                        <div class="screen-label">B1</div>
                        <div class="screen-title">How do you feel<br>today?</div>
                        <div class="subtitle">Pick a mood</div>

                        <div class="mood-grid">
                            <div class="mood-card ${selectedMood === 'Cute' ? 'selected' : ''}" onclick="selectMood('Cute')">
                                <div class="mood-icon">💕</div>
                                <div class="mood-label">Cute</div>
                            </div>

                            <div class="mood-card ${selectedMood === 'Cool' ? 'selected' : ''}" onclick="selectMood('Cool')">
                                <div class="mood-icon">⚡</div>
                                <div class="mood-label">Cool</div>
                            </div>

                            <div class="mood-card ${selectedMood === 'Natural' ? 'selected' : ''}" onclick="selectMood('Natural')">
                                <div class="mood-icon">🍃</div>
                                <div class="mood-label">Natural</div>
                            </div>

                            <div class="mood-card ${selectedMood === 'Night Out' ? 'selected' : ''}" onclick="selectMood('Night Out')">
                                <div class="mood-icon">🌙</div>
                                <div class="mood-label">Night Out</div>
                            </div>
                        </div>

                        <div class="bottom-fixed">
                            <button class="btn-primary" onclick="nextStep()">Continue</button>
                        </div>
                    </div>

                    <div class="mobile-screen" style="opacity: 0.3;">
                        <div class="screen-label">B2</div>
                        <div style="text-align: center; padding-top: 280px; color: #999;">
                            Select mood to continue
                        </div>
                    </div>

                    <div class="mobile-screen" style="opacity: 0.3;">
                        <div class="screen-label">B3</div>
                        <div style="text-align: center; padding-top: 280px; color: #999;">
                            Choose a look to try in AR
                        </div>
                    </div>
                `;
            } else if (currentStep === 2) {
                return `
                    <div class="mobile-screen" style="opacity: 0.3;">
                        <div class="screen-label">B1</div>
                    </div>

                    <div class="mobile-screen">
                        <div class="screen-label">B2</div>
                        <div class="top-bar">
                            <div class="back-arrow" onclick="prevStep()">←</div>
                            <div style="flex:1; text-align:center; font-size:16px; font-weight:600;">Recommended for ${selectedMood}</div>
                            <div style="width:36px;"></div>
                        </div>

                        <div class="carousel-item">
                            <div class="carousel-preview">
                                <div class="ar-face" style="width:110px; height:140px;"></div>
                            </div>
                            <div class="color-swatches">
                                <div class="swatch pink selected"></div>
                                <div class="swatch peach"></div>
                                <div class="swatch lavender"></div>
                            </div>
                            <div class="look-name">Soft Peach</div>
                            <button class="btn-primary" onclick="nextStep()">Try in AR</button>
                        </div>

                        <div class="nav-dots">
                            <span class="nav-dot active"></span>
                            <span class="nav-dot"></span>
                            <span class="nav-dot"></span>
                        </div>
                    </div>

                    <div class="mobile-screen" style="opacity: 0.3;">
                        <div class="screen-label">B3</div>
                        <div style="text-align: center; padding-top: 280px; color: #999;">
                            Click "Try in AR" to continue
                        </div>
                    </div>
                `;
            } else if (currentStep === 3) {
                return `
                    <div class="mobile-screen" style="opacity: 0.3;">
                        <div class="screen-label">B1</div>
                    </div>

                    <div class="mobile-screen" style="opacity: 0.3;">
                        <div class="screen-label">B2</div>
                    </div>

                    <div class="mobile-screen">
                        <div class="screen-label">B3</div>
                        <div class="screen-title" style="font-size:20px;">Try in AR</div>
                        <div class="subtitle">Soft Peach</div>

                        <div class="ar-camera" style="height:340px;">
                            <div class="ar-face" style="width:150px; height:190px;"></div>

                            <div class="color-selector-vertical">
                                <div class="color-option ${selectedColor === 0 ? 'selected' : ''}" style="background:#ffb3ba;" onclick="selectColor(0)"></div>
                                <div class="color-option ${selectedColor === 1 ? 'selected' : ''}" style="background:#ffdfba;" onclick="selectColor(1)"></div>
                                <div class="color-option ${selectedColor === 2 ? 'selected' : ''}" style="background:#e0bbe4;" onclick="selectColor(2)"></div>
                            </div>
                        </div>

                        <div class="hint-text">Tap colors to adjust</div>

                        <div class="bottom-fixed">
                            <div class="button-group">
                                <button class="btn-outline" onclick="prevStep()">Back</button>
                                <button class="btn-primary" style="flex:1;" onclick="alert('Look saved!'); currentStep = 1; renderScreens();">Save Look</button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function renderConceptC() {
            if (currentStep === 1) {
                return `
                    <div class="mobile-screen">
                        <div class="screen-label">C1</div>
                        <div class="screen-title">Fix My Makeup</div>

                        <div class="ar-camera" style="height:360px; margin-top:40px;">
                            <div style="width:170px; height:210px; border:3px dashed #ccc; border-radius:50% 50% 45% 45%; display:flex; align-items:center; justify-content:center;">
                                <div class="ar-face" style="width:150px; height:190px;"></div>
                            </div>
                        </div>

                        <div class="hint-text">Make sure your face is centered.</div>

                        <div class="capture-container">
                            <div class="capture-button" onclick="capturePhoto()"></div>
                            <div class="capture-label">Capture</div>
                        </div>
                    </div>

                    <div class="mobile-screen" style="opacity: 0.3;">
                        <div class="screen-label">C2</div>
                        <div style="text-align: center; padding-top: 280px; color: #999;">
                            Capture photo to analyze
                        </div>
                    </div>

                    <div class="mobile-screen" style="opacity: 0.3;">
                        <div class="screen-label">C3</div>
                        <div style="text-align: center; padding-top: 280px; color: #999;">
                            View analysis to fix makeup
                        </div>
                    </div>
                `;
            } else if (currentStep === 2) {
                return `
                    <div class="mobile-screen" style="opacity: 0.3;">
                        <div class="screen-label">C1</div>
                    </div>

                    <div class="mobile-screen">
                        <div class="screen-label">C2</div>
                        <div class="top-bar">
                            <div class="back-arrow" onclick="prevStep()">←</div>
                            <div style="flex:1; text-align:center; font-size:16px; font-weight:600;">Your Makeup Report</div>
                            <div style="width:36px;"></div>
                        </div>

                        <div class="analysis-photo">
                            <div class="ar-face" style="width:130px; height:160px;"></div>
                            <div class="marker marker1"></div>
                            <div class="marker marker2"></div>
                            <div class="marker marker3"></div>
                        </div>

                        <div class="issue-list">
                            <div class="issue-card">Left eyeliner too thick</div>
                            <div class="issue-card">Blush uneven</div>
                            <div class="issue-card">Highlight too strong</div>
                        </div>

                        <div class="bottom-fixed">
                            <button class="btn-primary" onclick="nextStep()">Fix with AR</button>
                        </div>
                    </div>

                    <div class="mobile-screen" style="opacity: 0.3;">
                        <div class="screen-label">C3</div>
                        <div style="text-align: center; padding-top: 280px; color: #999;">
                            Click "Fix with AR" to continue
                        </div>
                    </div>
                `;
            } else if (currentStep === 3) {
                return `
                    <div class="mobile-screen" style="opacity: 0.3;">
                        <div class="screen-label">C1</div>
                    </div>

                    <div class="mobile-screen" style="opacity: 0.3;">
                        <div class="screen-label">C2</div>
                    </div>

                    <div class="mobile-screen">
                        <div class="screen-label">C3</div>
                        <div class="top-bar">
                            <div class="back-arrow" onclick="prevStep()">←</div>
                            <div style="flex:1; text-align:center; font-size:16px; font-weight:600;">Fix Eyeliner</div>
                            <div style="width:36px;"></div>
                        </div>

                        <div class="ar-camera" style="height:300px; margin-top:24px;">
                            <div class="ar-face" style="width:150px; height:190px;">
                                <div class="ar-highlight" style="width:55px; height:35px; top:60px; left:28px; border-radius:50%;"></div>
                            </div>
                        </div>

                        <div class="slider-container">
                            <div class="slider-label">Adjust intensity</div>
                            <div class="slider-wrapper">
                                <div class="slider-text">Less</div>
                                <input type="range" min="0" max="100" value="50">
                                <div class="slider-text">More</div>
                            </div>
                        </div>

                        <div class="bottom-fixed">
                            <div class="button-group">
                                <button class="btn-outline" onclick="nextIssue()">Skip</button>
                                <button class="btn-primary" style="flex:1;" onclick="nextIssue()">Done</button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function attachEventListeners() {
            // Before/After long press
            const beforeAfter = document.getElementById('beforeAfter');
            if (beforeAfter) {
                let pressTimer;
                beforeAfter.addEventListener('mousedown', function() {
                    pressTimer = setTimeout(() => {
                        this.style.filter = 'grayscale(100%)';
                        this.querySelector('.overlay-hint').textContent = 'Before';
                    }, 500);
                });

                beforeAfter.addEventListener('mouseup', function() {
                    clearTimeout(pressTimer);
                    this.style.filter = '';
                    this.querySelector('.overlay-hint').textContent = 'Long press to see Before/After';
                });

                beforeAfter.addEventListener('mouseleave', function() {
                    clearTimeout(pressTimer);
                    this.style.filter = '';
                    this.querySelector('.overlay-hint').textContent = 'Long press to see Before/After';
                });
            }
        }

        function selectLook(look) {
            selectedLook = look;
            renderScreens();
        }

        function selectMood(mood) {
            selectedMood = mood;
            renderScreens();
        }

        function selectColor(index) {
            selectedColor = index;
            renderScreens();
        }

        function nextStep() {
            if (currentStep < 3) {
                currentStep++;
                renderScreens();
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                renderScreens();
            }
        }

        function capturePhoto() {
            capturedPhoto = true;
            nextStep();
        }

        function nextIssue() {
            alert('All issues fixed! Your makeup looks great.');
            currentStep = 1;
            renderScreens();
        }
    </script>
</body>
</html>
