<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makeup Magic - Enhanced Beauty Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            width: 100vw;
        }

        /* Game Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Main Canvas */
        #makeup-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: none;
        }

        /* Custom Cursor (Brush) */
        #custom-cursor {
            position: absolute;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.8);
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s;
            z-index: 100;
            display: none;
        }

        #custom-cursor.active {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.4), transparent);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
        }

        /* Particles Container */
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #fff, transparent);
            border-radius: 50%;
            animation: float-up 2s ease-out forwards;
            opacity: 0;
        }

        @keyframes float-up {
            0% {
                transform: translateY(0) scale(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-200px) scale(1.5);
                opacity: 0;
            }
        }

        /* Scene Overlay */
        #scene-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 1;
            transition: opacity 0.5s;
        }

        #scene-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .scene-title {
            font-size: 64px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            animation: glow-pulse 2s infinite;
        }

        @keyframes glow-pulse {
            0%, 100% { text-shadow: 0 0 40px rgba(255, 255, 255, 0.8); }
            50% { text-shadow: 0 0 80px rgba(255, 255, 255, 1); }
        }

        .scene-subtitle {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .start-btn {
            padding: 20px 60px;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 40px rgba(240, 147, 251, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 60px rgba(240, 147, 251, 0.8);
        }

        /* HUD - Game Interface */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 150;
        }

        /* Top Bar */
        .top-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px 40px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }

        .progress-indicator {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .star-count {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffd700;
            font-size: 20px;
            font-weight: 700;
        }

        /* Brush Size Selector - NEW */
        #brush-size-panel {
            position: absolute;
            left: 30px;
            top: 30%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: all;
        }

        .brush-size-label {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .size-option {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .size-option:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.3);
        }

        .size-option.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-color: #fff;
            box-shadow: 0 0 30px rgba(240, 147, 251, 0.8);
        }

        .size-indicator {
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            margin-bottom: 4px;
        }

        .size-option[data-size="small"] .size-indicator {
            width: 12px;
            height: 12px;
        }

        .size-option[data-size="medium"] .size-indicator {
            width: 20px;
            height: 20px;
        }

        .size-option[data-size="large"] .size-indicator {
            width: 28px;
            height: 28px;
        }

        .size-label {
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Tools Panel */
        #tools-panel {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            pointer-events: all;
        }

        .tool-item {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
        }

        .tool-item:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.3);
            border-color: #fff;
        }

        .tool-item.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-color: #fff;
            box-shadow: 0 0 30px rgba(240, 147, 251, 0.8);
        }

        .tool-icon {
            font-size: 32px;
            margin-bottom: 4px;
        }

        /* Color Palette */
        #color-palette {
            position: absolute;
            left: 30px;
            top: 60%;
            transform: translateY(-50%);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            pointer-events: all;
        }

        .color-swatch {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            border: 4px solid transparent;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .color-swatch:hover {
            transform: scale(1.15);
        }

        .color-swatch.active {
            border-color: #fff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
        }

        /* Intensity Slider */
        #intensity-control {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px 30px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            pointer-events: all;
        }

        .intensity-label {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 1px;
        }

        .intensity-slider {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, transparent 0%, #f093fb 100%);
            border-radius: 5px;
            outline: none;
        }

        .intensity-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        .intensity-slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        /* Action Buttons */
        #action-buttons {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 15px;
            pointer-events: all;
        }

        .action-btn {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 25px;
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
            transform: scale(1.05);
        }

        .action-btn.primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-color: #fff;
        }

        .action-btn.primary:hover {
            box-shadow: 0 0 30px rgba(240, 147, 251, 0.8);
        }

        /* Auto-Enhancement Animation - NEW */
        #enhancement-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent);
            opacity: 0;
            pointer-events: none;
            z-index: 180;
            transition: opacity 0.5s;
        }

        #enhancement-overlay.active {
            opacity: 1;
            animation: enhance-pulse 2s ease-in-out;
        }

        @keyframes enhance-pulse {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .enhancement-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 32px;
            font-weight: 700;
            text-shadow: 0 0 30px rgba(255, 255, 255, 1);
            animation: text-glow 2s ease-in-out;
        }

        @keyframes text-glow {
            0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
        }

        /* Final Showcase - NEW */
        #final-showcase {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            opacity: 0;
            transition: opacity 1s;
        }

        #final-showcase.show {
            display: flex;
            opacity: 1;
        }

        .showcase-title {
            font-size: 72px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 60px rgba(255, 255, 255, 1);
            margin-bottom: 40px;
            animation: showcase-title-in 1s ease-out;
        }

        @keyframes showcase-title-in {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        #final-character {
            width: 500px;
            height: 600px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            overflow: hidden;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.5);
            margin-bottom: 40px;
            animation: showcase-zoom-in 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
        }

        @keyframes showcase-zoom-in {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        #final-character::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            to { left: 100%; }
        }

        .showcase-stars {
            font-size: 80px;
            margin-bottom: 30px;
            animation: stars-pop 1s ease-out 1.5s both;
        }

        @keyframes stars-pop {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .showcase-message {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 40px;
            text-align: center;
            max-width: 600px;
            line-height: 1.6;
            animation: message-fade-in 1s ease-out 2s both;
        }

        @keyframes message-fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Completion Modal */
        #completion-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 500px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 30px;
            padding: 50px;
            text-align: center;
            z-index: 300;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        #completion-modal.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .completion-title {
            font-size: 48px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
        }

        .completion-stars {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .completion-message {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .unlock-badge {
            display: inline-block;
            padding: 10px 25px;
            background: rgba(255, 215, 0, 0.3);
            border: 2px solid #ffd700;
            border-radius: 20px;
            color: #ffd700;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* Loading/Processing Indicator */
        .processing-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 250;
        }

        .processing-overlay.show {
            display: flex;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .scene-title { font-size: 36px; }
            .scene-subtitle { font-size: 16px; }
            .start-btn { padding: 15px 40px; font-size: 18px; }
            #tools-panel { right: 15px; }
            .tool-item { width: 60px; height: 60px; }
            #color-palette { left: 15px; gap: 10px; }
            .color-swatch { width: 45px; height: 45px; }
            #intensity-control { width: 80%; }
            #brush-size-panel { left: 15px; }
            .size-option { width: 55px; height: 55px; }
            #final-character { width: 90%; max-width: 400px; height: 500px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Main Canvas -->
        <canvas id="makeup-canvas"></canvas>

        <!-- Custom Cursor -->
        <div id="custom-cursor"></div>

        <!-- Particles -->
        <div id="particles"></div>

        <!-- Auto-Enhancement Overlay -->
        <div id="enhancement-overlay">
            <div class="enhancement-text">✨ Auto-Enhancing... ✨</div>
        </div>

        <!-- Processing Overlay -->
        <div class="processing-overlay" id="processing-overlay">
            <div class="spinner"></div>
        </div>

        <!-- Scene Overlay -->
        <div id="scene-overlay">
            <div class="scene-title">Makeup Magic</div>
            <div class="scene-subtitle">Enhanced Beauty Experience</div>
            <button class="start-btn" onclick="startGame()">Start Experience</button>
        </div>

        <!-- HUD -->
        <div id="hud">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="progress-indicator">
                    <span id="current-step">Step 1</span> / <span id="total-steps">7</span>
                </div>
                <div class="star-count">
                    ⭐ <span id="star-total">0</span>
                </div>
            </div>

            <!-- Brush Size Panel - NEW -->
            <div id="brush-size-panel">
                <div class="brush-size-label">Brush Size</div>
                <div class="size-option active" data-size="small" onclick="setBrushSize('small')">
                    <div class="size-indicator"></div>
                    <div class="size-label">Small</div>
                </div>
                <div class="size-option" data-size="medium" onclick="setBrushSize('medium')">
                    <div class="size-indicator"></div>
                    <div class="size-label">Medium</div>
                </div>
                <div class="size-option" data-size="large" onclick="setBrushSize('large')">
                    <div class="size-indicator"></div>
                    <div class="size-label">Large</div>
                </div>
            </div>

            <!-- Tools Panel -->
            <div id="tools-panel">
                <!-- Dynamically generated -->
            </div>

            <!-- Color Palette -->
            <div id="color-palette">
                <!-- Dynamically generated -->
            </div>

            <!-- Intensity Control -->
            <div id="intensity-control">
                <div class="intensity-label">Intensity</div>
                <input type="range" class="intensity-slider" min="0" max="100" value="50" id="intensity-slider">
            </div>

            <!-- Action Buttons -->
            <div id="action-buttons">
                <button class="action-btn" onclick="undoLast()">Undo</button>
                <button class="action-btn" onclick="clearScene()">Clear</button>
                <button class="action-btn primary" onclick="completeStep()">Complete</button>
            </div>
        </div>

        <!-- Completion Modal -->
        <div id="completion-modal">
            <div class="completion-title">Perfect!</div>
            <div class="completion-stars">⭐⭐⭐</div>
            <div class="completion-message">
                You've mastered this step!<br>
                Your skills are glowing!
            </div>
            <div class="unlock-badge">🎁 Progress Saved</div>
            <button class="start-btn" onclick="nextScene()">Continue</button>
        </div>

        <!-- Final Showcase - NEW -->
        <div id="final-showcase">
            <div class="showcase-title">✨ Gorgeous! ✨</div>
            <div id="final-character">
                <canvas id="final-canvas"></canvas>
            </div>
            <div class="showcase-stars">⭐⭐⭐</div>
            <div class="showcase-message">
                You've created a stunning makeup look!<br>
                Total Stars Earned: <span id="final-star-count">21</span>
            </div>
            <button class="start-btn" onclick="resetGame()">Create New Look</button>
            <button class="start-btn" style="margin-top: 15px; background: rgba(255,255,255,0.2);" onclick="shareResult()">Share Your Creation</button>
        </div>
    </div>

    <script>
        // ===========================
        // AUDIO CONTEXT - NEW Enhanced Sound System
        // ===========================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function createSound(frequency, type = 'sine', duration = 0.1) {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.frequency.value = frequency;
            oscillator.type = type;

            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + duration);
        }

        const sounds = {
            brushStroke: () => {
                // Soft brush sound (low frequency, short)
                createSound(120, 'triangle', 0.05);
            },
            toolClick: () => {
                // Click sound
                createSound(800, 'square', 0.05);
            },
            blendWhoosh: () => {
                // Blend whoosh (sweeping frequency)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            },
            sparkle: () => {
                // Sparkle sound (high frequency, quick)
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        createSound(1200 + i * 200, 'sine', 0.1);
                    }, i * 50);
                }
            },
            success: () => {
                // Success chime (ascending notes)
                [262, 330, 392].forEach((freq, i) => {
                    setTimeout(() => createSound(freq, 'sine', 0.2), i * 100);
                });
            },
            enhance: () => {
                // Enhancement sound (magical sweep)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.8);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            }
        };

        // Ambient music (simple relaxing tone)
        let ambientOscillator = null;
        function startAmbientMusic() {
            if (ambientOscillator) return;

            ambientOscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            ambientOscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            ambientOscillator.frequency.value = 220;
            ambientOscillator.type = 'sine';
            gainNode.gain.value = 0.02; // Very quiet

            ambientOscillator.start();
        }

        function stopAmbientMusic() {
            if (ambientOscillator) {
                ambientOscillator.stop();
                ambientOscillator = null;
            }
        }

        // ===========================

        // ===========================
        // CANVAS SETUP
        // ===========================
        const canvas = document.getElementById('makeup-canvas');

        // ===========================
        // ENHANCED FACE DRAWING - More Detailed
        // ===========================
        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ambient particles
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            for (let i = 0; i < 50; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 3;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawFace() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const faceWidth = 350;
            const faceHeight = 450;

            ctx.save();

            // Face shape with more detail
            ctx.fillStyle = '#f5d5c8';
            ctx.beginPath();
            ctx.ellipse(centerX, centerY, faceWidth / 2, faceHeight / 2, 0, 0, Math.PI * 2);
            ctx.fill();

            // Skin texture gradient
            const skinGradient = ctx.createRadialGradient(centerX, centerY - 80, 50, centerX, centerY, faceWidth / 2);
            skinGradient.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
            skinGradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.1)');
            skinGradient.addColorStop(1, 'rgba(200, 150, 120, 0.2)');
            ctx.fillStyle = skinGradient;
            ctx.fill();

            // Subtle cheek contours (natural shadow)
            ctx.fillStyle = 'rgba(210, 170, 150, 0.3)';
            ctx.beginPath();
            ctx.ellipse(centerX - 80, centerY + 20, 40, 60, -0.3, 0, Math.PI * 2);
            ctx.ellipse(centerX + 80, centerY + 20, 40, 60, 0.3, 0, Math.PI * 2);
            ctx.fill();

            // Eyes (more detailed)
            // Eye whites
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(centerX - 60, centerY - 30, 18, 12, 0, 0, Math.PI * 2);
            ctx.ellipse(centerX + 60, centerY - 30, 18, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            // Irises
            const irisGradient = ctx.createRadialGradient(centerX - 60, centerY - 30, 5, centerX - 60, centerY - 30, 10);
            irisGradient.addColorStop(0, '#8b6f47');
            irisGradient.addColorStop(1, '#654321');
            ctx.fillStyle = irisGradient;
            ctx.beginPath();
            ctx.arc(centerX - 60, centerY - 30, 10, 0, Math.PI * 2);
            ctx.arc(centerX + 60, centerY - 30, 10, 0, Math.PI * 2);
            ctx.fill();

            // Pupils
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(centerX - 60, centerY - 30, 5, 0, Math.PI * 2);
            ctx.arc(centerX + 60, centerY - 30, 5, 0, Math.PI * 2);
            ctx.fill();

            // Eye shine
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(centerX - 58, centerY - 32, 3, 0, Math.PI * 2);
            ctx.arc(centerX + 62, centerY - 32, 3, 0, Math.PI * 2);
            ctx.fill();

            // Upper eyelids
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(centerX - 60, centerY - 25, 18, Math.PI, 0);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(centerX + 60, centerY - 25, 18, Math.PI, 0);
            ctx.stroke();

            // Eyebrows (more natural)
            ctx.strokeStyle = '#5d4037';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';

            ctx.beginPath();
            ctx.moveTo(centerX - 95, centerY - 65);
            ctx.quadraticCurveTo(centerX - 70, centerY - 75, centerX - 45, centerY - 68);
            ctx.quadraticCurveTo(centerX - 30, centerY - 63, centerX - 25, centerY - 58);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(centerX + 25, centerY - 58);
            ctx.quadraticCurveTo(centerX + 30, centerY - 63, centerX + 45, centerY - 68);
            ctx.quadraticCurveTo(centerX + 70, centerY - 75, centerX + 95, centerY - 65);
            ctx.stroke();

            // Nose (subtle)
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - 20);
            ctx.lineTo(centerX, centerY + 40);
            ctx.stroke();

            // Nostrils
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.beginPath();
            ctx.arc(centerX - 12, centerY + 40, 4, 0, Math.PI * 2);
            ctx.arc(centerX + 12, centerY + 40, 4, 0, Math.PI * 2);
            ctx.fill();

            // Lips (more detailed)
            // Upper lip
            ctx.fillStyle = '#d4a5a5';
            ctx.beginPath();
            ctx.moveTo(centerX - 50, centerY + 85);
            ctx.quadraticCurveTo(centerX - 25, centerY + 75, centerX, centerY + 78);
            ctx.quadraticCurveTo(centerX + 25, centerY + 75, centerX + 50, centerY + 85);
            ctx.quadraticCurveTo(centerX + 25, centerY + 90, centerX, centerY + 88);
            ctx.quadraticCurveTo(centerX - 25, centerY + 90, centerX - 50, centerY + 85);
            ctx.fill();

            // Lower lip
            ctx.beginPath();
            ctx.moveTo(centerX - 50, centerY + 85);
            ctx.quadraticCurveTo(centerX - 25, centerY + 100, centerX, centerY + 102);
            ctx.quadraticCurveTo(centerX + 25, centerY + 100, centerX + 50, centerY + 85);
            ctx.quadraticCurveTo(centerX, centerY + 88, centerX - 50, centerY + 85);
            ctx.fill();

            // Lip shine
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.beginPath();
            ctx.ellipse(centerX, centerY + 95, 30, 8, 0, 0, Math.PI);
            ctx.fill();

            // Cupid's bow highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.beginPath();
            ctx.ellipse(centerX, centerY + 78, 15, 4, 0, 0, Math.PI);
            ctx.fill();

            ctx.restore();
        }

        // ===========================
        // LAYER MANAGEMENT - NEW
        // ===========================
        function saveCurrentLayer() {
            const layerData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            gameState.savedLayers.push({
                scene: gameState.currentScene,
                data: layerData,
                timestamp: Date.now()
            });
            console.log(`✅ Layer ${gameState.currentScene} saved`);
        }

        function redrawAll() {
            drawBackground();
            drawFace();

            // Redraw all saved layers
            gameState.savedLayers.forEach(layer => {
                ctx.putImageData(layer.data, 0, 0);
            });
        }

        // ===========================
        // AUTO-ENHANCEMENT - NEW
        // ===========================
        function autoEnhance() {
            const overlay = document.getElementById('enhancement-overlay');
            overlay.classList.add('active');
            sounds.enhance();

            // Get current canvas data
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            // Apply enhancement algorithms
            // 1. Smooth transitions (simple blur on makeup areas)
            smoothTransitions(imageData);

            // 2. Boost saturation slightly
            boostSaturation(imageData, 1.1);

            // 3. Add subtle glow
            addSubtleGlow(imageData);

            // Put enhanced image back
            ctx.putImageData(imageData, 0, 0);

            // Redraw face outline to keep it crisp
            drawFace();

            setTimeout(() => {
                overlay.classList.remove('active');
                sounds.sparkle();
            }, 2000);
        }

        function smoothTransitions(imageData) {
            // Simple box blur on non-transparent pixels
            const width = imageData.width;
            const height = imageData.height;
            const data = imageData.data;
            const copy = new Uint8ClampedArray(data);

            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const idx = (y * width + x) * 4;

                    // Skip if transparent
                    if (copy[idx + 3] < 10) continue;

                    // Average with neighbors
                    for (let c = 0; c < 3; c++) {
                        const sum =
                            copy[idx + c] +
                            copy[idx - 4 + c] +
                            copy[idx + 4 + c] +
                            copy[(y - 1) * width * 4 + x * 4 + c] +
                            copy[(y + 1) * width * 4 + x * 4 + c];
                        data[idx + c] = sum / 5;
                    }
                }
            }
        }

        function boostSaturation(imageData, factor) {
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                if (data[i + 3] < 10) continue; // Skip transparent

                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                const gray = 0.299 * r + 0.587 * g + 0.114 * b;

                data[i] = Math.min(255, gray + (r - gray) * factor);
                data[i + 1] = Math.min(255, gray + (g - gray) * factor);
                data[i + 2] = Math.min(255, gray + (b - gray) * factor);
            }
        }

        function addSubtleGlow(imageData) {
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                if (data[i + 3] < 10) continue;

                // Slightly brighten
                data[i] = Math.min(255, data[i] + 5);
                data[i + 1] = Math.min(255, data[i + 1] + 5);
                data[i + 2] = Math.min(255, data[i + 2] + 5);
            }
        }

        // ===========================
        // BRUSH SIZE CONTROL - NEW
        // ===========================
        function setBrushSize(size) {
            gameState.brushSize = size;

            // Update UI
            document.querySelectorAll('.size-option').forEach(opt => {
                opt.classList.remove('active');
            });
            document.querySelector(`[data-size="${size}"]`).classList.add('active');

            // Update cursor size
            const cursorSize = brushSizes[size] * 2;
            const cursor = document.getElementById('custom-cursor');
            cursor.style.width = cursorSize + 'px';
            cursor.style.height = cursorSize + 'px';

            sounds.toolClick();
        }

        // ===========================
        // GAME INITIALIZATION
        // ===========================
        function startGame() {
            document.getElementById('scene-overlay').classList.add('hidden');
            startAmbientMusic();
            loadScene(0);
        }

        function loadScene(sceneIndex) {
            if (sceneIndex >= scenes.length) {
                showFinalShowcase();
                return;
            }

            gameState.currentScene = sceneIndex;
            const scene = scenes[sceneIndex];

            // Update HUD
            document.getElementById('current-step').textContent = `Step ${sceneIndex + 1}`;
            document.getElementById('total-steps').textContent = scenes.length;

            // Show scene title briefly
            showSceneTransition(scene);

            // Load tools
            loadTools(scene.tools);

            // Load colors
            loadColors(scene.colors);

            // Reset state
            gameState.isDrawing = false;
            gameState.strokeHistory = [];

            // Redraw everything
            redrawAll();
        }

        function showSceneTransition(scene) {
            const overlay = document.getElementById('scene-overlay');
            overlay.classList.remove('hidden');
            overlay.querySelector('.scene-title').textContent = scene.name;
            overlay.querySelector('.scene-subtitle').textContent = scene.subtitle;
            overlay.querySelector('.start-btn').textContent = 'Start';
            overlay.querySelector('.start-btn').onclick = () => {
                overlay.classList.add('hidden');
                createParticleBurst(canvas.width / 2, canvas.height / 2);
            };
        }

        // ===========================
        // TOOLS & COLORS
        // ===========================
        function loadTools(tools) {
            const panel = document.getElementById('tools-panel');
            panel.innerHTML = '';

            const toolIcons = {
                brush: '🖌️',
                sponge: '🧽',
                blend: '✨',
                pencil: '✏️',
                liquid: '💧',
                shimmer: '💫',
                gloss: '💎'
            };

            tools.forEach((tool, index) => {
                const toolDiv = document.createElement('div');
                toolDiv.className = 'tool-item' + (index === 0 ? ' active' : '');
                toolDiv.innerHTML = `
                    <div class="tool-icon">${toolIcons[tool] || '🎨'}</div>
                    <div>${tool}</div>
                `;
                toolDiv.onclick = () => selectTool(tool, toolDiv);
                panel.appendChild(toolDiv);
            });

            gameState.currentTool = tools[0];
        }

        function selectTool(tool, element) {
            gameState.currentTool = tool;
            document.querySelectorAll('.tool-item').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            sounds.toolClick();
        }

        function loadColors(colors) {
            const palette = document.getElementById('color-palette');
            palette.innerHTML = '';

            colors.forEach((color, index) => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch' + (index === 0 ? ' active' : '');
                swatch.style.background = color;
                swatch.onclick = () => selectColor(color, swatch);
                palette.appendChild(swatch);
            });

            gameState.currentColor = colors[0];
        }

        function selectColor(color, element) {
            gameState.currentColor = color;
            document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
            element.classList.add('active');
            sounds.toolClick();
        }

        // ===========================
        // DRAWING INTERACTION
        // ===========================
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            gameState.mousePos = { x: touch.clientX, y: touch.clientY };
            startDrawing();
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            gameState.mousePos = { x: touch.clientX, y: touch.clientY };
            draw(e);
        });

        canvas.addEventListener('touchend', stopDrawing);

        function startDrawing(e) {
            gameState.isDrawing = true;
            if (e) {
                gameState.mousePos = { x: e.clientX, y: e.clientY };
            }

            // Save state for undo
            gameState.strokeHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height));

            sounds.brushStroke();
        }

        function draw(e) {
            if (!gameState.isDrawing) {
                if (e) updateCursor(e);
                return;
            }

            if (e) {
                gameState.mousePos = { x: e.clientX, y: e.clientY };
                updateCursor(e);
            }

            const intensity = gameState.intensity / 100;
            const brushSize = brushSizes[gameState.brushSize];

            // Draw with current tool
            ctx.globalCompositeOperation = 'source-over';

            if (gameState.currentTool === 'blend') {
                ctx.globalCompositeOperation = 'multiply';
                ctx.globalAlpha = 0.1;
                sounds.blendWhoosh();
            } else if (gameState.currentTool === 'shimmer') {
                ctx.globalAlpha = 0.3;
            } else {
                ctx.globalAlpha = intensity * 0.6;
            }

            const gradient = ctx.createRadialGradient(
                gameState.mousePos.x, gameState.mousePos.y, 0,
                gameState.mousePos.x, gameState.mousePos.y, brushSize
            );
            gradient.addColorStop(0, gameState.currentColor);
            gradient.addColorStop(1, 'transparent');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(gameState.mousePos.x, gameState.mousePos.y, brushSize, 0, Math.PI * 2);
            ctx.fill();

            ctx.globalAlpha = 1;

            // Create particles occasionally
            if (Math.random() > 0.8) {
                createParticle(gameState.mousePos.x, gameState.mousePos.y);
            }
        }

        function stopDrawing() {
            gameState.isDrawing = false;
        }

        function updateCursor(e) {
            const cursor = document.getElementById('custom-cursor');
            cursor.style.display = 'block';
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            cursor.style.borderColor = gameState.currentColor;

            const cursorSize = brushSizes[gameState.brushSize] * 2;
            cursor.style.width = cursorSize + 'px';
            cursor.style.height = cursorSize + 'px';

            if (gameState.isDrawing) {
                cursor.classList.add('active');
            } else {
                cursor.classList.remove('active');
            }
        }

        canvas.addEventListener('mouseleave', () => {
            document.getElementById('custom-cursor').style.display = 'none';
        });

        // ===========================
        // INTENSITY SLIDER
        // ===========================
        document.getElementById('intensity-slider').addEventListener('input', (e) => {
            gameState.intensity = parseInt(e.target.value);
        });

        // ===========================
        // ACTIONS
        // ===========================
        function undoLast() {
            if (gameState.strokeHistory.length > 0) {
                const lastState = gameState.strokeHistory.pop();
                ctx.putImageData(lastState, 0, 0);
                sounds.toolClick();
            }
        }

        function clearScene() {
            redrawAll();
            gameState.strokeHistory = [];
            sounds.toolClick();
        }

        function completeStep() {
            // Save current layer
            saveCurrentLayer();

            // Auto-enhance
            autoEnhance();

            setTimeout(() => {
                const scene = scenes[gameState.currentScene];
                gameState.totalStars += scene.completionStars;
                document.getElementById('star-total').textContent = gameState.totalStars;

                // Show completion modal
                const modal = document.getElementById('completion-modal');
                modal.classList.add('show');

                createParticleBurst(canvas.width / 2, canvas.height / 2, 50);
                sounds.success();
            }, 2200);
        }

        function nextScene() {
            document.getElementById('completion-modal').classList.remove('show');

            // Transition effect
            const transition = document.createElement('div');
            transition.style.cssText = `
                position: absolute;
                top: 0; left: 0;
                width: 100%; height: 100%;
                background: radial-gradient(circle, transparent, rgba(255,255,255,0.8));
                opacity: 0;
                pointer-events: none;
                z-index: 250;
                animation: flash-transition 0.8s ease-out;
            `;
            document.getElementById('game-container').appendChild(transition);

            setTimeout(() => {
                loadScene(gameState.currentScene + 1);
                transition.remove();
            }, 800);
        }

        // ===========================
        // FINAL SHOWCASE - NEW
        // ===========================
        function showFinalShowcase() {
            stopAmbientMusic();

            const showcase = document.getElementById('final-showcase');
            const finalCanvas = document.getElementById('final-canvas');
            const finalCtx = finalCanvas.getContext('2d');

            // Set canvas size
            finalCanvas.width = 500;
            finalCanvas.height = 600;

            // Copy final result to showcase canvas
            finalCtx.drawImage(canvas,
                canvas.width/2 - 250, canvas.height/2 - 300,
                500, 600,
                0, 0,
                500, 600
            );

            // Update star count
            document.getElementById('final-star-count').textContent = gameState.totalStars;

            // Show with animation
            showcase.classList.add('show');

            // Particle burst
            setTimeout(() => {
                createParticleBurst(window.innerWidth / 2, window.innerHeight / 2, 100);
            }, 1500);

            // Success sounds
            setTimeout(() => sounds.success(), 500);
            setTimeout(() => sounds.sparkle(), 1500);
        }

        function resetGame() {
            gameState.currentScene = 0;
            gameState.totalStars = 0;
            gameState.savedLayers = [];
            gameState.strokeHistory = [];
            document.getElementById('star-total').textContent = 0;
            document.getElementById('final-showcase').classList.remove('show');
            startGame();
        }

        function shareResult() {
            alert('Share feature coming soon! Your beautiful creation will be shareable on social media.');
            // Future: Convert canvas to image and trigger share dialog
        }

        // ===========================
        // PARTICLES
        // ===========================
        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            document.getElementById('particles').appendChild(particle);

            setTimeout(() => particle.remove(), 2000);
        }

        function createParticleBurst(x, y, count = 20) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const offsetX = (Math.random() - 0.5) * 200;
                    const offsetY = (Math.random() - 0.5) * 200;
                    createParticle(x + offsetX, y + offsetY);
                }, i * 30);
            }
        }

        // ===========================
        // INITIALIZE
        // ===========================
        window.addEventListener('load', () => {
            console.log('🎮 Makeup Magic Enhanced - Ready!');
            console.log('✨ Features: Adjustable brush, auto-enhance, layer saving, final showcase, sounds');
        });
    </script>
