<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Makeup Tutor - Mid-Fidelity Mockup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .mockup-container {
            display: flex;
            gap: 30px;
            max-width: 1200px;
        }

        .screen {
            width: 375px;
            height: 667px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            overflow: hidden;
            position: relative;
        }

        /* Screen 1 - Look Selection */
        .screen-1 {
            padding: 50px 24px 24px;
        }

        .screen-1 h1 {
            font-size: 28px;
            color: #2c2c2c;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .screen-1 .subtitle {
            font-size: 16px;
            color: #8c8c8c;
            margin-bottom: 32px;
        }

        .look-card {
            background: #f8f8f8;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .look-card:hover {
            border-color: #ffb3c1;
        }

        .face-thumbnail {
            width: 70px;
            height: 70px;
            background: #e8e8e8;
            border-radius: 12px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .look-info {
            flex: 1;
        }

        .look-title {
            font-size: 18px;
            font-weight: 600;
            color: #2c2c2c;
            margin-bottom: 6px;
        }

        .look-meta {
            display: flex;
            gap: 16px;
            font-size: 14px;
            color: #8c8c8c;
        }

        .stars {
            color: #ffb3c1;
        }

        .primary-button {
            width: 100%;
            background: #ffb3c1;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 18px;
            font-size: 17px;
            font-weight: 600;
            margin-top: auto;
            position: absolute;
            bottom: 24px;
            left: 24px;
            right: 24px;
            cursor: pointer;
        }

        /* Screen 2 - AR Step */
        .screen-2 {
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 50px 24px 16px;
            background: #ffffff;
        }

        .back-arrow {
            width: 24px;
            height: 24px;
            color: #2c2c2c;
        }

        .step-info {
            text-align: center;
            flex: 1;
        }

        .step-number {
            font-size: 14px;
            color: #8c8c8c;
            margin-bottom: 4px;
        }

        .step-label {
            font-size: 17px;
            font-weight: 600;
            color: #2c2c2c;
        }

        .spacer {
            width: 24px;
        }

        .camera-view {
            flex: 1;
            background: #e8e8e8;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ar-highlight {
            position: absolute;
            background: rgba(255, 179, 193, 0.3);
            border: 2px solid rgba(255, 179, 193, 0.6);
            border-radius: 50%;
        }

        .highlight-cheek-left {
            width: 80px;
            height: 80px;
            top: 35%;
            left: 20%;
        }

        .highlight-cheek-right {
            width: 80px;
            height: 80px;
            top: 35%;
            right: 20%;
        }

        .highlight-forehead {
            width: 100px;
            height: 60px;
            top: 18%;
            left: 50%;
            transform: translateX(-50%);
        }

        .instruction-panel {
            background: #ffffff;
            padding: 24px;
            border-top: 1px solid #e8e8e8;
        }

        .instruction-text {
            font-size: 16px;
            color: #2c2c2c;
            line-height: 1.5;
            margin-bottom: 20px;
            text-align: center;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .ghost-button {
            flex: 1;
            background: transparent;
            border: 2px solid #d8d8d8;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: #2c2c2c;
            cursor: pointer;
        }

        .next-button {
            flex: 1;
            background: #ffb3c1;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
        }

        .progress-bar {
            display: flex;
            gap: 4px;
            height: 4px;
        }

        .progress-segment {
            flex: 1;
            background: #e8e8e8;
            border-radius: 2px;
        }

        .progress-segment.active {
            background: #ffb3c1;
        }

        /* Screen 3 - Final Result */
        .screen-3 {
            padding: 50px 24px 24px;
            display: flex;
            flex-direction: column;
        }

        .screen-3 h1 {
            font-size: 28px;
            color: #2c2c2c;
            margin-bottom: 8px;
            font-weight: 600;
            text-align: center;
        }

        .screen-3 .subtitle {
            font-size: 16px;
            color: #8c8c8c;
            margin-bottom: 32px;
            text-align: center;
        }

        .result-preview {
            width: 100%;
            height: 340px;
            background: #e8e8e8;
            border-radius: 16px;
            position: relative;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay-text {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
        }

        .save-button {
            width: 100%;
            background: #ffb3c1;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
        }

        .secondary-button {
            width: 100%;
            background: transparent;
            border: 2px solid #d8d8d8;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: #2c2c2c;
            cursor: pointer;
        }

        /* Abstract Face Illustrations */
        .abstract-face {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .face-circle {
            width: 60%;
            height: 75%;
            background: #d8d8d8;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .face-feature {
            position: absolute;
            background: #b8b8b8;
            border-radius: 50%;
        }

        .eye-left {
            width: 8px;
            height: 8px;
            top: 40%;
            left: 35%;
        }

        .eye-right {
            width: 8px;
            height: 8px;
            top: 40%;
            right: 35%;
        }

        .nose {
            width: 4px;
            height: 12px;
            border-radius: 2px;
            top: 52%;
            left: 50%;
            transform: translateX(-50%);
        }

        .mouth {
            width: 16px;
            height: 8px;
            border-radius: 0 0 16px 16px;
            top: 65%;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Larger face for camera view */
        .large-face .face-circle {
            width: 50%;
            height: 65%;
        }

        .large-face .eye-left,
        .large-face .eye-right {
            width: 12px;
            height: 12px;
        }

        .large-face .nose {
            width: 6px;
            height: 18px;
        }

        .large-face .mouth {
            width: 24px;
            height: 12px;
        }

        /* Final result face with makeup */
        .makeup-face .face-circle {
            background: #e8d4c8;
        }

        .makeup-face .blush-left,
        .makeup-face .blush-right {
            width: 24px;
            height: 24px;
            background: rgba(255, 179, 193, 0.4);
            border-radius: 50%;
            position: absolute;
            top: 48%;
        }

        .makeup-face .blush-left {
            left: 25%;
        }

        .makeup-face .blush-right {
            right: 25%;
        }

        .makeup-face .lips {
            width: 28px;
            height: 14px;
            background: #d98b9c;
            border-radius: 0 0 28px 28px;
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translateX(-50%);
        }

        .makeup-face .eye-left,
        .makeup-face .eye-right {
            background: #6c5647;
        }

        @media (max-width: 1200px) {
            .mockup-container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="mockup-container">
        <!-- SCREEN 1: Look Selection -->
        <div class="screen screen-1">
            <h1>Today's Makeup</h1>
            <p class="subtitle">Choose a look to start</p>

            <div class="look-card">
                <div class="face-thumbnail">
                    <div class="abstract-face">
                        <div class="face-circle"></div>
                        <div class="face-feature eye-left"></div>
                        <div class="face-feature eye-right"></div>
                        <div class="face-feature nose"></div>
                        <div class="face-feature mouth"></div>
                    </div>
                </div>
                <div class="look-info">
                    <div class="look-title">Date Look</div>
                    <div class="look-meta">
                        <span>7 min</span>
                        <span class="stars">★★☆</span>
                    </div>
                </div>
            </div>

            <div class="look-card">
                <div class="face-thumbnail">
                    <div class="abstract-face">
                        <div class="face-circle"></div>
                        <div class="face-feature eye-left"></div>
                        <div class="face-feature eye-right"></div>
                        <div class="face-feature nose"></div>
                        <div class="face-feature mouth"></div>
                    </div>
                </div>
                <div class="look-info">
                    <div class="look-title">School Look</div>
                    <div class="look-meta">
                        <span>10 min</span>
                        <span class="stars">★☆☆</span>
                    </div>
                </div>
            </div>

            <div class="look-card">
                <div class="face-thumbnail">
                    <div class="abstract-face">
                        <div class="face-circle"></div>
                        <div class="face-feature eye-left"></div>
                        <div class="face-feature eye-right"></div>
                        <div class="face-feature nose"></div>
                        <div class="face-feature mouth"></div>
                    </div>
                </div>
                <div class="look-info">
                    <div class="look-title">Interview Look</div>
                    <div class="look-meta">
                        <span>12 min</span>
                        <span class="stars">★★★</span>
                    </div>
                </div>
            </div>

            <button class="primary-button">Start Tutorial</button>
        </div>

        <!-- SCREEN 2: AR Step Instruction -->
        <div class="screen screen-2">
            <div class="top-bar">
                <svg class="back-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
                <div class="step-info">
                    <div class="step-number">Step 1 of 8</div>
                    <div class="step-label">Foundation</div>
                </div>
                <div class="spacer"></div>
            </div>

            <div class="camera-view">
                <div class="abstract-face large-face">
                    <div class="face-circle"></div>
                    <div class="face-feature eye-left"></div>
                    <div class="face-feature eye-right"></div>
                    <div class="face-feature nose"></div>
                    <div class="face-feature mouth"></div>
                </div>
                <div class="ar-highlight highlight-cheek-left"></div>
                <div class="ar-highlight highlight-cheek-right"></div>
                <div class="ar-highlight highlight-forehead"></div>
            </div>

            <div class="instruction-panel">
                <p class="instruction-text">Apply foundation evenly on the highlighted area.</p>
                <div class="button-group">
                    <button class="ghost-button">Back</button>
                    <button class="next-button">Next</button>
                </div>
                <div class="progress-bar">
                    <div class="progress-segment active"></div>
                    <div class="progress-segment"></div>
                    <div class="progress-segment"></div>
                    <div class="progress-segment"></div>
                    <div class="progress-segment"></div>
                    <div class="progress-segment"></div>
                    <div class="progress-segment"></div>
                    <div class="progress-segment"></div>
                </div>
            </div>
        </div>

        <!-- SCREEN 3: Final Result -->
        <div class="screen screen-3">
            <h1>Great job!</h1>
            <p class="subtitle">You completed today's look.</p>

            <div class="result-preview">
                <div class="abstract-face large-face makeup-face">
                    <div class="face-circle"></div>
                    <div class="blush-left"></div>
                    <div class="blush-right"></div>
                    <div class="face-feature eye-left"></div>
                    <div class="face-feature eye-right"></div>
                    <div class="face-feature nose"></div>
                    <div class="lips"></div>
                </div>
                <div class="overlay-text">Long press for Before / After</div>
            </div>

            <div class="action-buttons">
                <button class="save-button">Save Look</button>
                <button class="secondary-button">Restart</button>
                <button class="secondary-button">Exit</button>
            </div>
        </div>
    </div>
</body>
</html>
