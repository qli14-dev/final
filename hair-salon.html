<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snip & Style - The Wacky Hair Salon Game! 💇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Comic Sans MS', 'Segoe UI', cursive, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            height: 100vh;
            width: 100vw;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #salon-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* Funny Commentary Bubble */
        #commentary {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 40px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: bold;
            color: #ff6b9d;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 200;
            max-width: 80%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        #commentary.show {
            opacity: 1;
        }

        /* Customer Face Reaction */
        #customer-reaction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 150;
            text-shadow: 0 0 20px rgba(255,255,255,0.8);
        }

        #customer-reaction.show {
            opacity: 1;
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.3); }
        }

        /* Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            transition: opacity 0.5s;
        }

        #start-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .game-title {
            font-size: 72px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 40px rgba(255,255,255,0.8);
            margin-bottom: 20px;
            animation: rainbow 3s infinite;
        }

        @keyframes rainbow {
            0% { color: #ff6b9d; }
            25% { color: #ffd700; }
            50% { color: #48dbfb; }
            75% { color: #ff9ff3; }
            100% { color: #ff6b9d; }
        }

        .subtitle {
            font-size: 28px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 40px;
        }

        .start-btn {
            padding: 20px 60px;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 40px rgba(240,147,251,0.5);
            text-transform: uppercase;
        }

        .start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 60px rgba(240,147,251,0.8);
        }

        /* Tools Panel */
        #tools-panel {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
        }

        .tool-btn {
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.9);
            border: 4px solid transparent;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .tool-btn:hover {
            transform: scale(1.1);
            background: rgba(255,255,255,1);
        }

        .tool-btn.active {
            border-color: #f093fb;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 0 30px rgba(240,147,251,0.8);
        }

        .tool-label {
            font-size: 12px;
            font-weight: 600;
            color: #333;
            margin-top: 5px;
        }

        .tool-btn.active .tool-label {
            color: #fff;
        }

        /* Color Palette */
        #color-palette {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            z-index: 100;
        }

        .color-swatch {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            border: 5px solid transparent;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .color-swatch:hover {
            transform: scale(1.15);
        }

        .color-swatch.active {
            border-color: #fff;
            box-shadow: 0 0 30px rgba(255,255,255,0.9);
        }

        /* Action Buttons */
        #action-buttons {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .action-btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            background: rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .action-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        .action-btn.primary {
            background: linear-gradient(135deg, #4ade80 0%, #16a34a 100%);
            border-color: #fff;
        }

        /* Hair Length Indicator */
        #hair-length {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(255,255,255,0.9);
            padding: 15px 30px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 100;
        }

        /* Feedback Message */
        #feedback-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 22px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 180;
            pointer-events: none;
            text-align: center;
        }

        #feedback-message.show {
            opacity: 1;
            animation: feedback-pop 0.6s ease;
        }

        @keyframes feedback-pop {
            0% { transform: translate(-50%, -50%) scale(0.8); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* Color Picker Modal */
        #color-picker-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            z-index: 250;
            transition: transform 0.3s ease;
        }

        #color-picker-modal.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .color-option {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            cursor: pointer;
            border: 4px solid transparent;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .color-option:hover {
            transform: scale(1.1);
            border-color: #f093fb;
        }

        .close-modal-btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .close-modal-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102,126,234,0.5);
        }

        /* Hairspray Lock Indicator */
        #lock-indicator {
            position: absolute;
            top: 30px;
            left: 30px;
            background: rgba(255, 215, 0, 0.9);
            color: #333;
            padding: 15px 25px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 100;
            display: none;
            animation: pulse 1s infinite;
        }

        #lock-indicator.show {
            display: block;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Completion Screen */
        #completion-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 250;
        }

        #completion-screen.show {
            display: flex;
        }

        .completion-title {
            font-size: 64px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 40px rgba(255,255,255,0.8);
            margin-bottom: 30px;
        }

        .rating-stars {
            font-size: 80px;
            margin-bottom: 30px;
        }

        .customer-feedback {
            font-size: 32px;
            color: #fff;
            margin-bottom: 40px;
            text-align: center;
            max-width: 600px;
            line-height: 1.4;
        }

        /* Flying Hair Clippings */
        .hair-clip {
            position: absolute;
            width: 20px;
            height: 30px;
            background: linear-gradient(135deg, #654321 0%, #432818 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
            animation: fall 2s ease-out forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(500px) rotate(720deg);
                opacity: 0;
            }
        }

        /* Sparkles for styling */
        .sparkle {
            position: absolute;
            width: 15px;
            height: 15px;
            background: radial-gradient(circle, #ffd700, transparent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
            animation: sparkle-anim 1s ease-out forwards;
        }

        @keyframes sparkle-anim {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: scale(2) rotate(180deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="salon-canvas"></canvas>

        <!-- Start Screen -->
        <div id="start-screen">
            <div class="game-title">✂️ Snip & Style ✂️</div>
            <div class="subtitle">The World's Wackiest Hair Salon!</div>
            <button class="start-btn" onclick="GameController.startGame()">Let's Get Styling!</button>
        </div>

        <!-- Commentary Bubble -->
        <div id="commentary"></div>

        <!-- Customer Reaction -->
        <div id="customer-reaction"></div>

        <!-- Hair Length Indicator -->
        <div id="hair-length">Hair Length: 100%</div>

        <!-- Lock Indicator -->
        <div id="lock-indicator">🔒 Length Locked!</div>

        <!-- Feedback Message -->
        <div id="feedback-message"></div>

        <!-- Color Picker Modal -->
        <div id="color-picker-modal">
            <div class="modal-title">Choose Hair Color 🎨</div>
            <div class="color-grid">
                <div class="color-option" style="background: #654321" onclick="GameController.applyDyeColor('#654321')"></div>
                <div class="color-option" style="background: #000000" onclick="GameController.applyDyeColor('#000000')"></div>
                <div class="color-option" style="background: #8b4513" onclick="GameController.applyDyeColor('#8b4513')"></div>
                <div class="color-option" style="background: #ffd700" onclick="GameController.applyDyeColor('#ffd700')"></div>
                <div class="color-option" style="background: #ff6b9d" onclick="GameController.applyDyeColor('#ff6b9d')"></div>
                <div class="color-option" style="background: #9370db" onclick="GameController.applyDyeColor('#9370db')"></div>
                <div class="color-option" style="background: #00ced1" onclick="GameController.applyDyeColor('#00ced1')"></div>
                <div class="color-option" style="background: #ff4500" onclick="GameController.applyDyeColor('#ff4500')"></div>
                <div class="color-option" style="background: #32cd32" onclick="GameController.applyDyeColor('#32cd32')"></div>
            </div>
            <button class="close-modal-btn" onclick="GameController.closeColorPicker()">Close</button>
        </div>

        <!-- Tools Panel -->
        <div id="tools-panel">
            <div class="tool-btn active" data-tool="scissors" onclick="GameController.selectTool('scissors', this)">
                <div>✂️</div>
                <div class="tool-label">Scissors</div>
            </div>
            <div class="tool-btn" data-tool="clippers" onclick="GameController.selectTool('clippers', this)">
                <div>🪒</div>
                <div class="tool-label">Clippers</div>
            </div>
            <div class="tool-btn" data-tool="dye" onclick="GameController.selectTool('dye', this)">
                <div>🎨</div>
                <div class="tool-label">Hair Dye</div>
            </div>
            <div class="tool-btn" data-tool="curler" onclick="GameController.selectTool('curler', this)">
                <div>🌀</div>
                <div class="tool-label">Curler</div>
            </div>
            <div class="tool-btn" data-tool="straightener" onclick="GameController.selectTool('straightener', this)">
                <div>📏</div>
                <div class="tool-label">Straighten</div>
            </div>
            <div class="tool-btn" data-tool="spray" onclick="GameController.selectTool('spray', this)">
                <div>✨</div>
                <div class="tool-label">Hairspray</div>
            </div>
        </div>

        <!-- Color Palette -->
        <div id="color-palette">
            <div class="color-swatch active" style="background: #654321" onclick="GameController.selectColor('#654321', this)"></div>
            <div class="color-swatch" style="background: #ffd700" onclick="GameController.selectColor('#ffd700', this)"></div>
            <div class="color-swatch" style="background: #ff6b9d" onclick="GameController.selectColor('#ff6b9d', this)"></div>
            <div class="color-swatch" style="background: #9370db" onclick="GameController.selectColor('#9370db', this)"></div>
            <div class="color-swatch" style="background: #00ced1" onclick="GameController.selectColor('#00ced1', this)"></div>
            <div class="color-swatch" style="background: #ff4500" onclick="GameController.selectColor('#ff4500', this)"></div>
            <div class="color-swatch" style="background: #32cd32" onclick="GameController.selectColor('#32cd32', this)"></div>
            <div class="color-swatch" style="background: #000000" onclick="GameController.selectColor('#000000', this)"></div>
        </div>

        <!-- Action Buttons -->
        <div id="action-buttons">
            <button class="action-btn" onclick="GameController.undoAction()">Undo</button>
            <button class="action-btn" onclick="GameController.resetHair()">Reset Hair</button>
            <button class="action-btn primary" onclick="GameController.finishStyling()">Finish & Show!</button>
        </div>

        <!-- Completion Screen -->
        <div id="completion-screen">
            <div class="completion-title">✨ Fabulous! ✨</div>
            <div class="rating-stars" id="rating-stars">⭐⭐⭐⭐⭐</div>
            <div class="customer-feedback" id="customer-feedback"></div>
            <button class="start-btn" onclick="GameController.newCustomer()">Next Customer!</button>
        </div>
    </div>

    <script>
        // ===========================
        // GAME STATE - CENTRALIZED STATE MANAGEMENT
        // ===========================
        const gameState = {
            // Hair properties
            hairLength: 100,          // 0-100: current length
            targetMin: 30,            // Target minimum length for good rating
            targetMax: 70,            // Target maximum length for good rating
            style: 'straight',        // 'straight', 'curly', 'default'
            color: '#654321',         // Current hair color (brown default)
            shine: 50,                // 0-100: hair shine level

            // Customer properties
            customerMood: 75,         // 0-100: customer satisfaction
            customerIndex: 0,         // Current customer index

            // Tool state
            currentTool: 'scissors',  // Active tool
            lengthLocked: false,      // Hairspray lock state
            isDrawing: false,         // Mouse interaction state (legacy)
            mousePos: { x: 0, y: 0 }, // Current mouse position

            // History for undo system
            history: [],              // Stack of previous states
            maxHistorySize: 20,       // Maximum undo steps

            // UI state
            isGameActive: false,      // Game running state

            /**
             * Push current state to history stack for undo functionality
             */
            pushState() {
                const snapshot = {
                    hairLength: this.hairLength,
                    style: this.style,
                    color: this.color,
                    shine: this.shine,
                    customerMood: this.customerMood,
                    timestamp: Date.now()
                };

                this.history.push(snapshot);

                // Limit history size to prevent memory issues
                if (this.history.length > this.maxHistorySize) {
                    this.history.shift();
                }

                console.log(`State pushed. History size: ${this.history.length}`);
            },

            /**
             * Restore previous state from history
             * @returns {boolean} True if undo was successful
             */
            popState() {
                if (this.history.length === 0) {
                    console.log('No history to undo');
                    return false;
                }

                const previousState = this.history.pop();

                // Restore state properties
                this.hairLength = previousState.hairLength;
                this.style = previousState.style;
                this.color = previousState.color;
                this.shine = previousState.shine;
                this.customerMood = previousState.customerMood;

                console.log(`State restored. History size: ${this.history.length}`);
                return true;
            },

            /**
             * Update all UI elements to reflect current state
             */
            updateUI() {
                // Update hair length indicator
                const hairLengthEl = document.getElementById('hair-length');
                if (hairLengthEl) {
                    hairLengthEl.textContent = `Hair Length: ${Math.round(this.hairLength)}%`;
                }

                // Update lock indicator
                const lockEl = document.getElementById('lock-indicator');
                if (lockEl) {
                    if (this.lengthLocked) {
                        lockEl.classList.add('show');
                    } else {
                        lockEl.classList.remove('show');
                    }
                }

                // Redraw canvas
                Renderer.drawScene();

                // Update customer mood (could affect facial expression in future)
                this.updateCustomerMood();
            },

            /**
             * Calculate and update customer mood based on current state
             * Returns the mood change delta for feedback
             */
            updateCustomerMood() {
                const oldMood = this.customerMood;

                // Base mood calculation
                let mood = 50;

                // Check if length is in target range (biggest factor)
                const targetCenter = (this.targetMin + this.targetMax) / 2;
                const targetRange = this.targetMax - this.targetMin;
                const lengthDiff = Math.abs(this.hairLength - targetCenter);

                if (lengthDiff < targetRange / 2) {
                    // Within target range
                    mood += 30;
                } else if (lengthDiff < targetRange) {
                    // Close to target
                    mood += 15;
                } else {
                    // Far from target
                    mood -= 10;
                }

                // Bonus for good shine
                if (this.shine > 60) {
                    mood += 10;
                }

                // Mood decreases if hair too short or too long
                if (this.hairLength < 10) {
                    mood -= 30;
                } else if (this.hairLength > 95) {
                    mood -= 5;
                }

                // Clamp mood between 0-100
                this.customerMood = Math.max(0, Math.min(100, mood));

                return this.customerMood - oldMood;
            },

            /**
             * Toggle hairspray lock
             */
            toggleLengthLock() {
                this.lengthLocked = !this.lengthLocked;
                this.updateUI();
            },

            /**
             * Unlock hair length (used after one action)
             */
            unlockLength() {
                this.lengthLocked = false;
                this.updateUI();
            },

            /**
             * Reset state to defaults for new customer
             */
            resetToDefaults() {
                this.hairLength = 100;
                this.style = 'straight';
                this.color = '#654321';
                this.shine = 50;
                this.customerMood = 75;
                this.currentTool = 'scissors';
                this.lengthLocked = false;
                this.history = [];
                this.isDrawing = false;

                // Set random target for variety
                this.targetMin = 20 + Math.floor(Math.random() * 30);
                this.targetMax = this.targetMin + 20 + Math.floor(Math.random() * 30);

                console.log(`New customer! Target length: ${this.targetMin}-${this.targetMax}%`);

                this.updateUI();
            },

            /**
             * Modify hair length with bounds checking
             * @param {number} delta - Amount to change length by
             * @returns {boolean} True if length was modified, false if locked
             */
            modifyHairLength(delta) {
                if (this.lengthLocked) {
                    console.log('Hair length is locked!');
                    return false;
                }

                this.pushState();
                const oldLength = this.hairLength;
                this.hairLength = Math.max(0, Math.min(100, this.hairLength + delta));
                this.updateUI();

                // Auto-unlock after one use
                this.unlockLength();

                return true;
            },

            /**
             * Set hair style
             * @param {string} newStyle - 'straight', 'curly', or 'default'
             */
            setStyle(newStyle) {
                this.pushState();
                this.style = newStyle;
                this.updateUI();
            },

            /**
             * Set hair color
             * @param {string} newColor - Hex color code
             */
            setColor(newColor) {
                this.pushState();
                this.color = newColor;
                this.updateUI();
            },

            /**
             * Modify shine level
             * @param {number} delta - Amount to change shine by
             */
            modifyShine(delta) {
                this.pushState();
                this.shine = Math.max(0, Math.min(100, this.shine + delta));
                this.updateUI();
            }
        };

        // ===========================
        // CONFIGURATION DATA
        // ===========================
        const Config = {
            customers: [
                { name: "Bob", wantsCrazy: true },
                { name: "Karen", wantsPerfection: true },
                { name: "Chad", wantsMullet: true },
                { name: "Tiffany", wantsColorful: true },
                { name: "Grandpa Joe", wantsSimple: true }
            ],

            funnyComments: {
                cutting: [
                    "Ooh, getting shorter! 💇",
                    "Snip snip! Looking good!",
                    "Easy there, tiger! 😅",
                    "That's quite the trim!",
                    "My ears are still there, right? 👂"
                ],
                clipping: [
                    "BZZZZZZ! That tickles! 😂",
                    "Going for the buzz cut, eh?",
                    "So bald, so beautiful! ✨",
                    "I can feel the breeze already!",
                    "Channeling my inner monk! 🧘"
                ],
                dyeing: [

        // ===========================
        // RENDERER - HANDLES ALL CANVAS DRAWING
        // ===========================
        const Renderer = {
            canvas: null,
            ctx: null,

            initialize() {
                this.canvas = document.getElementById('salon-canvas');
                this.ctx = this.canvas.getContext('2d');

                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
            },

            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.drawScene();
            },

            drawScene() {
                this.drawBackground();
                this.drawSalonChair();
                this.drawCustomer();
            },

            drawBackground() {
                const gradient = this.ctx.createLinearGradient(0, 0, this.canvas.width, this.canvas.height);
                gradient.addColorStop(0, '#ffecd2');
                gradient.addColorStop(1, '#fcb69f');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            },

            drawSalonChair() {
                const centerX = this.canvas.width / 2;
                const bottomY = this.canvas.height - 50;

                // Chair seat
                this.ctx.fillStyle = '#8b4513';
                this.ctx.fillRect(centerX - 150, bottomY - 100, 300, 20);

                // Chair back
                this.ctx.fillRect(centerX - 120, bottomY - 300, 20, 200);

                // Chair base
                this.ctx.fillRect(centerX - 30, bottomY - 100, 60, 100);

                // Chrome pole
                const poleGradient = this.ctx.createLinearGradient(centerX - 15, 0, centerX + 15, 0);
                poleGradient.addColorStop(0, '#aaa');
                poleGradient.addColorStop(0.5, '#fff');
                poleGradient.addColorStop(1, '#aaa');
                this.ctx.fillStyle = poleGradient;
                this.ctx.fillRect(centerX - 15, bottomY - 100, 30, 100);
            },

            drawCustomer() {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;

                // Head
                this.ctx.fillStyle = '#f5d5c8';
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY, 120, 0, Math.PI * 2);
                this.ctx.fill();

                // Face features
                this.drawFace(centerX, centerY);

                // HAIR - uses gameState
                this.drawHair(centerX, centerY);

                // Body
                this.ctx.fillStyle = '#3498db';
                this.ctx.fillRect(centerX - 100, centerY + 120, 200, 200);

                // Salon cape
                this.ctx.fillStyle = 'rgba(0,0,0,0.2)';
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY + 120, 150, 0, Math.PI);
                this.ctx.fill();
            },

            drawFace(centerX, centerY) {
                // Eyes
                this.ctx.fillStyle = '#fff';
                this.ctx.beginPath();
                this.ctx.arc(centerX - 40, centerY - 20, 15, 0, Math.PI * 2);
                this.ctx.arc(centerX + 40, centerY - 20, 15, 0, Math.PI * 2);
                this.ctx.fill();

                this.ctx.fillStyle = '#000';
                this.ctx.beginPath();
                this.ctx.arc(centerX - 40, centerY - 20, 8, 0, Math.PI * 2);
                this.ctx.arc(centerX + 40, centerY - 20, 8, 0, Math.PI * 2);
                this.ctx.fill();

                // Nose
                this.ctx.strokeStyle = '#000';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.moveTo(centerX, centerY - 10);
                this.ctx.lineTo(centerX, centerY + 20);
                this.ctx.stroke();

                // Mouth - could vary based on customerMood in future
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY + 30, 30, 0, Math.PI);
                this.ctx.stroke();
            },

            drawHair(centerX, centerY) {
                const lengthMultiplier = gameState.hairLength / 100;

                this.ctx.save();
                this.ctx.fillStyle = gameState.color;

                // Draw based on style
                if (gameState.style === 'curly') {
                    this.drawCurlyHair(centerX, centerY, lengthMultiplier);
                } else {
                    this.drawStraightHair(centerX, centerY, lengthMultiplier);
                }

                // Add shine effect based on shine level
                if (gameState.shine > 50) {
                    this.ctx.globalAlpha = (gameState.shine - 50) / 100;
                    const shineGradient = this.ctx.createRadialGradient(
                        centerX - 30, centerY - 100, 10,
                        centerX, centerY - 80, 60
                    );
                    shineGradient.addColorStop(0, 'rgba(255,255,255,0.8)');
                    shineGradient.addColorStop(1, 'transparent');
                    this.ctx.fillStyle = shineGradient;
                    this.ctx.fillRect(centerX - 80, centerY - 150, 160, 100);
                }

                this.ctx.restore();
            },

            drawStraightHair(centerX, centerY, lengthMultiplier) {
                const baseLength = 200 * lengthMultiplier;

                // Hair top
                this.ctx.beginPath();
                this.ctx.ellipse(centerX, centerY - 100, 130, 50, 0, 0, Math.PI * 2);
                this.ctx.fill();

                // Hair sides
                this.ctx.beginPath();
                this.ctx.ellipse(centerX - 80, centerY - 50, 40, baseLength / 2, 0, 0, Math.PI * 2);
                this.ctx.ellipse(centerX + 80, centerY - 50, 40, baseLength / 2, 0, 0, Math.PI * 2);
                this.ctx.fill();

                // Hair back
                this.ctx.beginPath();
                this.ctx.ellipse(centerX, centerY - 20, 90, baseLength / 2.5, 0, 0, Math.PI);
                this.ctx.fill();
            },

            drawCurlyHair(centerX, centerY, lengthMultiplier) {
                const numCurls = 20;
                const baseRadius = 30;

                for (let i = 0; i < numCurls; i++) {
                    const angle = (Math.PI * 2 / numCurls) * i;
                    const distance = 100 + (Math.random() * 30);
                    const x = centerX + Math.cos(angle) * distance;
                    const y = centerY - 80 + Math.sin(angle) * distance * 0.5;

                    this.ctx.beginPath();
                    this.ctx.arc(x, y, baseRadius * lengthMultiplier, 0, Math.PI * 2);
                    this.ctx.fill();

                    // Draw curly spiral
                    if (lengthMultiplier > 0.5) {
                        for (let j = 0; j < 3; j++) {
                            const offsetY = y + (j * 20 * lengthMultiplier);
                            const offsetX = x + (Math.sin(j) * 10);
                            this.ctx.beginPath();
                            this.ctx.arc(offsetX, offsetY, baseRadius * 0.8 * lengthMultiplier, 0, Math.PI * 2);
                            this.ctx.fill();
                        }
                    }
                }
            }
        };

        // ===========================
        // EFFECTS - UI EFFECTS AND ANIMATIONS
        // ===========================
        const Effects = {
            createHairClipping(x, y) {
                const clip = document.createElement('div');
                clip.className = 'hair-clip';
                clip.style.left = x + 'px';
                clip.style.top = y + 'px';
                clip.style.background = `linear-gradient(135deg, ${gameState.color}, ${this.darkenColor(gameState.color)})`;
                document.getElementById('game-container').appendChild(clip);

                setTimeout(() => clip.remove(), 2000);
            },

            createSparkle(x, y) {
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        const sparkle = document.createElement('div');
                        sparkle.className = 'sparkle';
                        sparkle.style.left = (x + (Math.random() - 0.5) * 100) + 'px';
                        sparkle.style.top = (y + (Math.random() - 0.5) * 100) + 'px';
                        document.getElementById('game-container').appendChild(sparkle);

                        setTimeout(() => sparkle.remove(), 1000);
                    }, i * 100);
                }
            },

            showComment(type) {
                const comments = Config.funnyComments[type];
                if (!comments) return;

                const comment = comments[Math.floor(Math.random() * comments.length)];
                const bubble = document.getElementById('commentary');
                bubble.textContent = comment;
                bubble.classList.add('show');

                setTimeout(() => {
                    bubble.classList.remove('show');
                }, 2000);
            },

            showReaction(emoji) {
                const reaction = document.getElementById('customer-reaction');
                reaction.textContent = emoji;
                reaction.classList.add('show');

                setTimeout(() => {
                    reaction.classList.remove('show');
                }, 1000);
            },

            /**
             * Show feedback message to user
             * @param {string} message - The feedback message
             * @param {number} duration - Duration in ms (default 2000)
             */
            showFeedback(message, duration = 2000) {
                const feedback = document.getElementById('feedback-message');
                feedback.textContent = message;
                feedback.classList.add('show');

                setTimeout(() => {
                    feedback.classList.remove('show');
                }, duration);
            },

            darkenColor(color) {
                const hex = color.replace('#', '');
                const r = Math.max(0, parseInt(hex.substr(0, 2), 16) - 40);
                const g = Math.max(0, parseInt(hex.substr(2, 2), 16) - 40);
                const b = Math.max(0, parseInt(hex.substr(4, 2), 16) - 40);
                return `rgb(${r}, ${g}, ${b})`;
            }
        };

        // ===========================
        // AUDIO - SOUND EFFECTS SYSTEM
        // ===========================
        const Audio = {
            audioCtx: null,

            initialize() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.audioCtx = new AudioContext();
            },

            playSound(type) {
                if (!this.audioCtx) return;

                const oscillator = this.audioCtx.createOscillator();
                const gainNode = this.audioCtx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(this.audioCtx.destination);

                switch(type) {
                    case 'snip':
                        oscillator.frequency.value = 800;
                        oscillator.type = 'square';
                        gainNode.gain.setValueAtTime(0.1, this.audioCtx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.1);
                        oscillator.start(this.audioCtx.currentTime);
                        oscillator.stop(this.audioCtx.currentTime + 0.1);
                        break;

                    case 'buzz':
                        oscillator.frequency.value = 200;
                        oscillator.type = 'sawtooth';
                        gainNode.gain.value = 0.05;
                        oscillator.start(this.audioCtx.currentTime);
                        oscillator.stop(this.audioCtx.currentTime + 0.2);
                        break;

                    case 'splash':
                        oscillator.frequency.value = 400;
                        oscillator.type = 'sine';
                        gainNode.gain.setValueAtTime(0.1, this.audioCtx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.3);
                        oscillator.start(this.audioCtx.currentTime);
                        oscillator.stop(this.audioCtx.currentTime + 0.3);
                        break;

                    case 'sizzle':
                        oscillator.frequency.value = 600;
                        oscillator.type = 'triangle';
                        gainNode.gain.value = 0.08;
                        oscillator.start(this.audioCtx.currentTime);
                        oscillator.stop(this.audioCtx.currentTime + 0.15);
                        break;

                    case 'spray':
                        oscillator.frequency.value = 3000;
                        oscillator.type = 'sawtooth';
                        gainNode.gain.value = 0.03;
                        oscillator.start(this.audioCtx.currentTime);
                        oscillator.stop(this.audioCtx.currentTime + 0.5);
                        break;

                    case 'click':
                        oscillator.frequency.value = 1000;
                        oscillator.type = 'sine';
                        gainNode.gain.setValueAtTime(0.1, this.audioCtx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.05);
                        oscillator.start(this.audioCtx.currentTime);
                        oscillator.stop(this.audioCtx.currentTime + 0.05);
                        break;

                    case 'complete':
                        [262, 330, 392, 523].forEach((freq, i) => {
                            setTimeout(() => {
                                const osc = this.audioCtx.createOscillator();
                                const gain = this.audioCtx.createGain();
                                osc.connect(gain);
                                gain.connect(this.audioCtx.destination);
                                osc.frequency.value = freq;
                                osc.type = 'sine';
                                gain.gain.setValueAtTime(0.1, this.audioCtx.currentTime);
                                gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.3);
                                osc.start(this.audioCtx.currentTime);
                                osc.stop(this.audioCtx.currentTime + 0.3);
                            }, i * 150);
                        });
                        break;

                    case 'whoosh':
                        oscillator.frequency.setValueAtTime(800, this.audioCtx.currentTime);
                        oscillator.frequency.exponentialRampToValueAtTime(100, this.audioCtx.currentTime + 0.5);
                        oscillator.type = 'sawtooth';
                        gainNode.gain.setValueAtTime(0.1, this.audioCtx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.5);
                        oscillator.start(this.audioCtx.currentTime);
                        oscillator.stop(this.audioCtx.currentTime + 0.5);
                        break;
                }
            }
        };

        // ===========================
        // GAME CONTROLLER - MAIN GAME LOGIC
        // ===========================
        const GameController = {
            initialize() {
                Renderer.initialize();
                Audio.initialize();
                this.setupEventListeners();
            },

            setupEventListeners() {
                const canvas = Renderer.canvas;

                // Click-based interaction
                canvas.addEventListener('click', (e) => this.handleCanvasClick(e));

                // Touch events
                canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    const touch = e.changedTouches[0];
                    const clickEvent = { clientX: touch.clientX, clientY: touch.clientY };
                    this.handleCanvasClick(clickEvent);
                });
            },

            /**
             * Handle canvas clicks - apply current tool
             */
            handleCanvasClick(e) {
                if (!gameState.isGameActive) return;

                const x = e.clientX;
                const y = e.clientY;

                // Execute tool action
                switch(gameState.currentTool) {
                    case 'scissors':
                        this.useScissors(x, y);
                        break;
                    case 'clippers':
                        this.useClippers(x, y);
                        break;
                    case 'dye':
                        this.useDye();
                        break;
                    case 'curler':
                        this.useCurler(x, y);
                        break;
                    case 'straightener':
                        this.useStraightener(x, y);
                        break;
                    case 'spray':
                        this.useHairspray(x, y);
                        break;
                }
            },

            /**
             * SCISSORS - Reduce hair length by 5-10 randomly
             */
            useScissors(x, y) {
                const reduction = -1 * (5 + Math.floor(Math.random() * 6)); // -5 to -10

                if (!gameState.modifyHairLength(reduction)) {
                    Effects.showFeedback('Hair is locked! 🔒');
                    return;
                }

                const actualReduction = Math.abs(reduction);

                // Visual effects
                Effects.createHairClipping(x, y);
                Effects.showComment('cutting');
                Audio.playSound('snip');

                // Feedback
                const moodChange = gameState.updateCustomerMood();
                const moodEmoji = moodChange > 0 ? '😊' : moodChange < 0 ? '😟' : '😐';
                Effects.showFeedback(`Snipped ${actualReduction}% ${moodEmoji}`);
            },

            /**
             * CLIPPERS - Reduce hair length by 20-30 randomly
             */
            useClippers(x, y) {
                const reduction = -1 * (20 + Math.floor(Math.random() * 11)); // -20 to -30

                if (!gameState.modifyHairLength(reduction)) {
                    Effects.showFeedback('Hair is locked! 🔒');
                    return;
                }

                const actualReduction = Math.abs(reduction);

                // Visual effects
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        Effects.createHairClipping(x + (Math.random() - 0.5) * 50, y + (Math.random() - 0.5) * 50);
                    }, i * 100);
                }
                Effects.showComment('clipping');
                Audio.playSound('buzz');

                // Feedback
                const moodChange = gameState.updateCustomerMood();
                const moodEmoji = moodChange > 0 ? '😊' : moodChange < 0 ? '😟' : '😐';
                Effects.showFeedback(`Buzzed ${actualReduction}% ${moodEmoji}`);
            },

            /**
             * DYE - Open color picker
             */
            useDye() {
                document.getElementById('color-picker-modal').classList.add('show');
                Audio.playSound('click');
            },

            /**
             * Apply selected dye color
             */
            applyDyeColor(color) {
                gameState.setColor(color);
                this.closeColorPicker();

                // Visual effects
                Effects.showComment('dyeing');
                Effects.showReaction('🎨');
                Audio.playSound('splash');

                // Feedback
                const moodChange = gameState.updateCustomerMood();
                const moodEmoji = moodChange > 0 ? '😊' : moodChange < 0 ? '😟' : '😐';
                Effects.showFeedback(`Hair dyed! ${moodEmoji}`);
            },

            /**
             * Close color picker modal
             */
            closeColorPicker() {
                document.getElementById('color-picker-modal').classList.remove('show');
            },

            /**
             * CURLER - Change style to curly
             */
            useCurler(x, y) {
                if (gameState.style === 'curly') {
                    Effects.showFeedback('Hair is already curly! 🌀');
                    return;
                }

                gameState.setStyle('curly');

                // Visual effects
                Effects.showComment('curling');
                Audio.playSound('sizzle');

                // Feedback
                const moodChange = gameState.updateCustomerMood();
                const moodEmoji = moodChange > 0 ? '😊' : moodChange < 0 ? '😟' : '😐';
                Effects.showFeedback(`Hair is now curly! 🌀 ${moodEmoji}`);
            },

            /**
             * STRAIGHTENER - Change style to straight
             */
            useStraightener(x, y) {
                if (gameState.style === 'straight') {
                    Effects.showFeedback('Hair is already straight! 📏');
                    return;
                }

                gameState.setStyle('straight');

                // Visual effects
                Effects.showComment('straightening');
                Audio.playSound('sizzle');

                // Feedback
                const moodChange = gameState.updateCustomerMood();
                const moodEmoji = moodChange > 0 ? '😊' : moodChange < 0 ? '😟' : '😐';
                Effects.showFeedback(`Hair is now straight! 📏 ${moodEmoji}`);
            },

            /**
             * HAIRSPRAY - Lock hair length for next action
             */
            useHairspray(x, y) {
                gameState.toggleLengthLock();
                gameState.modifyShine(5);

                // Visual effects
                Effects.createSparkle(x, y);
                Effects.showComment('spray');
                Audio.playSound('spray');

                // Feedback
                if (gameState.lengthLocked) {
                    Effects.showFeedback('Hair length locked! 🔒✨');
                } else {
                    Effects.showFeedback('Lock removed! ✨');
                }
            },

            startGame() {
                document.getElementById('start-screen').classList.add('hidden');
                gameState.isGameActive = true;
                gameState.resetToDefaults();
                Renderer.drawScene();
                Audio.playSound('whoosh');

                // Show welcome message
                setTimeout(() => {
                    const bubble = document.getElementById('commentary');
                    bubble.textContent = "Hi! I'm ready for a fabulous new look! 💇✨";
                    bubble.classList.add('show');
                    setTimeout(() => bubble.classList.remove('show'), 3000);
                }, 500);
            },

            selectTool(tool, element) {
                gameState.currentTool = tool;
                document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
                element.classList.add('active');
                Audio.playSound('click');
            },

            selectColor(color, element) {
                gameState.setColor(color);
                document.querySelectorAll('.color-swatch').forEach(sw => sw.classList.remove('active'));
                element.classList.add('active');
                Audio.playSound('click');
            },

            undoAction() {
                if (gameState.popState()) {
                    gameState.updateUI();
                    Audio.playSound('click');
                }
            },

            resetHair() {
                gameState.resetToDefaults();
                Audio.playSound('whoosh');
                Effects.showComment('cutting');
            },

            finishStyling() {
                const rating = this.calculateRating();
                this.showCompletionScreen(rating);
            },

            calculateRating() {
                const mood = gameState.customerMood;

                if (mood >= 80) return { stars: 5, type: 'awesome' };
                if (mood >= 60) return { stars: 4, type: 'good' };
                if (mood >= 40) return { stars: 3, type: 'okay' };
                return { stars: 2, type: 'bad' };
            },

            showCompletionScreen(rating) {
                const screen = document.getElementById('completion-screen');
                const starsEl = document.getElementById('rating-stars');
                const feedbackEl = document.getElementById('customer-feedback');

                // Set stars
                starsEl.textContent = '⭐'.repeat(rating.stars);

                // Set feedback
                const comments = Config.completionComments[rating.type];
                feedbackEl.textContent = comments[Math.floor(Math.random() * comments.length)];

                screen.classList.add('show');
                Audio.playSound('complete');

                // Sparkle effect
                for (let i = 0; i < 20; i++) {
                    setTimeout(() => {
                        Effects.createSparkle(
                            Math.random() * window.innerWidth,
                            Math.random() * window.innerHeight
                        );
                    }, i * 100);
                }
            },

            newCustomer() {
                document.getElementById('completion-screen').classList.remove('show');
                gameState.customerIndex = (gameState.customerIndex + 1) % Config.customers.length;
                this.resetHair();
                Audio.playSound('whoosh');
            }
        };

        // ===========================
        // INITIALIZE GAME
        // ===========================
        window.addEventListener('load', () => {
            GameController.initialize();
            console.log('✂️ Snip & Style - Hair Salon Game Ready! ✂️');
            console.log('State-based architecture loaded');
            console.log('Game State:', gameState);
        });
    </script>
