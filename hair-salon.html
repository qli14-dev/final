<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✂️ Snip & Style - Hair Salon Game 💇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ffd89b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-container {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 300px;
            grid-template-rows: 1fr auto;
            gap: 0;
        }

        /* Character Preview Area */
        #character-area {
            grid-column: 1;
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
        }

        #character-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1;
        }

        /* Tool Panel */
        #tool-panel {
            grid-column: 2;
            grid-row: 1;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
        }

        .panel-title {
            font-size: 22px;
            font-weight: 700;
            color: #ff6b9d;
            margin-bottom: 25px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .tool-btn {
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            background: white;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .tool-btn:hover {
            transform: translateX(-5px);
            border-color: #ff6b9d;
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.3);
        }

        .tool-btn.active {
            background: linear-gradient(135deg, #ff6b9d, #f093fb);
            color: white;
            border-color: #ff6b9d;
            transform: translateX(-8px);
        }

        .tool-icon {
            font-size: 32px;
            min-width: 40px;
            text-align: center;
        }

        .color-picker {
            margin-top: 20px;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .color-btn {
            width: 100%;
            aspect-ratio: 1;
            border: 3px solid white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .color-btn:hover {
            transform: scale(1.1);
            border-color: #ff6b9d;
        }

        .color-btn.active {
            border-color: #ff6b9d;
            box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.3);
        }

        /* Status Bar */
        #status-bar {
            grid-column: 2;
            grid-row: 2;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 20px;
            border-top: 3px solid #ff6b9d;
        }

        .status-item {
            margin-bottom: 15px;
        }

        .status-label {
            font-size: 11px;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .progress-bar {
            width: 100%;
            height: 25px;
            background: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            transition: width 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: white;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .mood-indicator {
            font-size: 32px;
            text-align: center;
            margin: 10px 0;
        }

        .status-value {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 8px;
            text-align: center;
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-btn.primary {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: white;
        }

        .action-btn.secondary {
            background: #e0e0e0;
            color: #333;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        /* Message Area */
        #message-area {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
            pointer-events: none;
            text-align: center;
            max-width: 80%;
        }

        #message-area.show {
            opacity: 1;
            animation: message-bounce 0.5s ease;
        }

        @keyframes message-bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        /* Results Modal */
        #results-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        #results-modal.show {
            display: flex;
        }

        .results-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            animation: modal-pop 0.4s ease;
        }

        @keyframes modal-pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .results-title {
            font-size: 32px;
            font-weight: 700;
            color: #ff6b9d;
            margin-bottom: 20px;
        }

        .stars {
            font-size: 48px;
            margin: 20px 0;
        }

        .results-message {
            font-size: 18px;
            color: #666;
            margin: 20px 0;
            line-height: 1.6;
        }

        /* Sound Toggle */
        #sound-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            z-index: 50;
        }

        #sound-toggle:hover {
            transform: scale(1.1);
        }

        /* Customer Info */
        #customer-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .customer-name {
            font-size: 20px;
            font-weight: 700;
            color: #ff6b9d;
            margin-bottom: 5px;
        }

        .customer-request {
            font-size: 14px;
            color: #666;
        }

        /* Responsive */
        @media (max-width: 768px) {
            #game-container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto auto;
            }

            #character-area {
                grid-column: 1;
                grid-row: 1;
                padding: 20px;
            }

            #tool-panel {
                grid-column: 1;
                grid-row: 2;
                max-height: 200px;
            }

            .tool-btn {
                padding: 10px;
                font-size: 14px;
            }

            #status-bar {
                grid-column: 1;
                grid-row: 3;
            }
        }
    </style>
</head>
<body>
    <!-- Sound Toggle -->
    <button id="sound-toggle" onclick="toggleSound()">🔊</button>

    <!-- Game Container -->
    <div id="game-container">
        <!-- Character Preview Area -->
        <div id="character-area">
            <!-- Customer Info -->
            <div id="customer-info">
                <div class="customer-name" id="customer-name">Customer #1</div>
                <div class="customer-request" id="customer-request">Wants: Medium length (30-70%)</div>
            </div>

            <!-- Message Area -->
            <div id="message-area"></div>

            <!-- Character SVG -->
            <div id="character-container">
                <svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
                    <!-- Shoulders/Torso -->
                    <path d="M 100 400 Q 100 450 150 480 L 250 480 Q 300 450 300 400 L 300 350 Q 250 360 200 360 Q 150 360 100 350 Z"
                          fill="#ffd4c8" stroke="#d4a89a" stroke-width="2"/>

                    <!-- Neck -->
                    <rect x="175" y="280" width="50" height="80" fill="#ffd4c8" stroke="#d4a89a" stroke-width="2" rx="10"/>

                    <!-- Head -->
                    <ellipse cx="200" cy="200" rx="100" ry="120" fill="#ffd4c8" stroke="#d4a89a" stroke-width="3"/>

                    <!-- Hair (will be dynamically updated) -->
                    <g id="hair-group">
                        <!-- Hair base - long hair by default -->
                        <path id="hair-path"
                              d="M 100 150 Q 80 100 90 80 Q 100 50 130 40 Q 160 35 200 35 Q 240 35 270 40 Q 300 50 310 80 Q 320 100 300 150 L 290 350 Q 280 380 250 390 L 150 390 Q 120 380 110 350 Z"
                              fill="#654321" stroke="#4a3018" stroke-width="2"/>

                        <!-- Hair shine -->
                        <ellipse id="hair-shine" cx="150" cy="100" rx="30" ry="40" fill="white" opacity="0.3"/>
                    </g>

                    <!-- Face features -->
                    <!-- Eyes -->
                    <ellipse cx="165" cy="190" rx="12" ry="18" fill="white"/>
                    <ellipse cx="235" cy="190" rx="12" ry="18" fill="white"/>
                    <circle cx="165" cy="195" r="8" fill="#2c1810"/>
                    <circle cx="235" cy="195" r="8" fill="#2c1810"/>
                    <circle cx="167" cy="193" r="3" fill="white"/>
                    <circle cx="237" cy="193" r="3" fill="white"/>

                    <!-- Eyebrows -->
                    <path d="M 150 170 Q 165 165 180 170" stroke="#2c1810" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <path d="M 220 170 Q 235 165 250 170" stroke="#2c1810" stroke-width="3" fill="none" stroke-linecap="round"/>

                    <!-- Nose -->
                    <path d="M 200 210 L 195 225 M 200 210 L 205 225" stroke="#d4a89a" stroke-width="2" fill="none" stroke-linecap="round"/>

                    <!-- Mouth -->
                    <path id="mouth" d="M 180 245 Q 200 255 220 245" stroke="#d4a89a" stroke-width="3" fill="none" stroke-linecap="round"/>

                    <!-- Blush -->
                    <ellipse cx="140" cy="220" rx="20" ry="12" fill="#ffb3ba" opacity="0.5"/>
                    <ellipse cx="260" cy="220" rx="20" ry="12" fill="#ffb3ba" opacity="0.5"/>
                </svg>
            </div>
        </div>

        <!-- Tool Panel -->
        <div id="tool-panel">
            <h2 class="panel-title">🛠️ Tools</h2>

            <button class="tool-btn active" data-tool="scissors" onclick="selectTool('scissors', this)">
                <span class="tool-icon">✂️</span>
                <span>Scissors</span>
            </button>

            <button class="tool-btn" data-tool="clippers" onclick="selectTool('clippers', this)">
                <span class="tool-icon">🪒</span>
                <span>Clippers</span>
            </button>

            <button class="tool-btn" data-tool="curler" onclick="selectTool('curler', this)">
                <span class="tool-icon">🌀</span>
                <span>Curler</span>
            </button>

            <button class="tool-btn" data-tool="straightener" onclick="selectTool('straightener', this)">
                <span class="tool-icon">📏</span>
                <span>Straightener</span>
            </button>

            <button class="tool-btn" data-tool="spray" onclick="selectTool('spray', this)">
                <span class="tool-icon">✨</span>
                <span>Hairspray</span>
            </button>

            <div class="color-picker">
                <div class="status-label">Hair Dye Colors</div>
                <div class="color-grid">
                    <button class="color-btn active" style="background: #654321" onclick="selectColor('#654321', this)"></button>
                    <button class="color-btn" style="background: #000000" onclick="selectColor('#000000', this)"></button>
                    <button class="color-btn" style="background: #ffd700" onclick="selectColor('#ffd700', this)"></button>
                    <button class="color-btn" style="background: #ff6b9d" onclick="selectColor('#ff6b9d', this)"></button>
                    <button class="color-btn" style="background: #9370db" onclick="selectColor('#9370db', this)"></button>
                    <button class="color-btn" style="background: #00ced1" onclick="selectColor('#00ced1', this)"></button>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div id="status-bar">
            <div class="status-item">
                <div class="status-label">Hair Length</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="length-progress" style="width: 100%">100%</div>
                </div>
            </div>

            <div class="status-item">
                <div class="status-label">Style</div>
                <div class="status-value" id="style-display">Straight</div>
            </div>

            <div class="status-item">
                <div class="status-label">Color</div>
                <div class="status-value" id="color-display">Brown</div>
            </div>

            <div class="status-item">
                <div class="status-label">Customer Mood</div>
                <div class="mood-indicator" id="mood-display">😊</div>
            </div>

            <div class="action-btns">
                <button class="action-btn secondary" onclick="undoAction()">↩️ Undo</button>
                <button class="action-btn secondary" onclick="resetHair()">🔄 Reset</button>
                <button class="action-btn primary" onclick="finishAndShow()">✨ Finish & Show!</button>
            </div>
        </div>
    </div>

    <!-- Results Modal -->
    <div id="results-modal">
        <div class="results-content">
            <div class="results-title">Customer Feedback</div>
            <div class="stars" id="stars-display">⭐⭐⭐⭐⭐</div>
            <div class="results-message" id="results-message"></div>
            <button class="action-btn primary" onclick="nextCustomer()" style="margin-top: 20px;">Next Customer 👉</button>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="audio-snip" src="snip.mp3" preload="auto"></audio>
    <audio id="audio-buzz" src="buzz.mp3" preload="auto"></audio>
    <audio id="audio-spray" src="spray.mp3" preload="auto"></audio>
    <audio id="audio-click" src="click.mp3" preload="auto"></audio>
    <audio id="audio-success" src="success.mp3" preload="auto"></audio>
    <audio id="audio-bgm" src="bgm.mp3" loop volume="0.3"></audio>

    <script>
        // Game State
        const gameState = {
            hairLength: 100,
            targetMin: 30,
            targetMax: 70,
            style: 'straight',
            color: '#654321',
            customerMood: 75,
            currentTool: 'scissors',
            customerIndex: 1,
            history: [],
            soundEnabled: true,
            maxHistorySize: 20
        };

        // Hair style definitions
        const hairStyles = {
            long: {
                straight: 'M 100 150 Q 80 100 90 80 Q 100 50 130 40 Q 160 35 200 35 Q 240 35 270 40 Q 300 50 310 80 Q 320 100 300 150 L 290 350 Q 280 380 250 390 L 150 390 Q 120 380 110 350 Z',
                curly: 'M 100 150 Q 80 100 90 80 Q 100 50 130 40 Q 160 35 200 35 Q 240 35 270 40 Q 300 50 310 80 Q 320 100 300 150 Q 310 200 290 250 Q 310 300 280 350 Q 270 380 250 390 L 150 390 Q 130 380 120 350 Q 90 300 110 250 Q 90 200 100 150 Z',
                wavy: 'M 100 150 Q 80 100 90 80 Q 100 50 130 40 Q 160 35 200 35 Q 240 35 270 40 Q 300 50 310 80 Q 320 100 300 150 Q 310 220 280 290 Q 270 340 250 390 L 150 390 Q 130 340 120 290 Q 90 220 100 150 Z'
            },
            medium: {
                straight: 'M 100 150 Q 80 100 90 80 Q 100 50 130 40 Q 160 35 200 35 Q 240 35 270 40 Q 300 50 310 80 Q 320 100 300 150 L 290 270 Q 280 290 250 295 L 150 295 Q 120 290 110 270 Z',
                curly: 'M 100 150 Q 80 100 90 80 Q 100 50 130 40 Q 160 35 200 35 Q 240 35 270 40 Q 300 50 310 80 Q 320 100 300 150 Q 315 190 285 230 Q 275 260 250 295 L 150 295 Q 125 260 115 230 Q 85 190 100 150 Z',
                wavy: 'M 100 150 Q 80 100 90 80 Q 100 50 130 40 Q 160 35 200 35 Q 240 35 270 40 Q 300 50 310 80 Q 320 100 300 150 Q 310 210 280 260 Q 270 280 250 295 L 150 295 Q 130 280 120 260 Q 90 210 100 150 Z'
            },
            bob: {
                straight: 'M 100 150 Q 80 100 90 80 Q 100 50 130 40 Q 160 35 200 35 Q 240 35 270 40 Q 300 50 310 80 Q 320 100 300 150 L 290 210 Q 280 230 250 235 L 150 235 Q 120 230 110 210 Z',
                curly: 'M 100 150 Q 80 100 90 80 Q 100 50 130 40 Q 160 35 200 35 Q 240 35 270 40 Q 300 50 310 80 Q 320 100 300 150 Q 315 180 285 205 Q 275 220 250 235 L 150 235 Q 125 220 115 205 Q 85 180 100 150 Z',
                wavy: 'M 100 150 Q 80 100 90 80 Q 100 50 130 40 Q 160 35 200 35 Q 240 35 270 40 Q 300 50 310 80 Q 320 100 300 150 Q 310 185 280 210 Q 270 225 250 235 L 150 235 Q 130 225 120 210 Q 90 185 100 150 Z'
            },
            short: {
                straight: 'M 100 150 Q 80 100 90 80 Q 100 50 130 40 Q 160 35 200 35 Q 240 35 270 40 Q 300 50 310 80 Q 320 100 300 150 L 290 170 Q 280 180 250 182 L 150 182 Q 120 180 110 170 Z',
                curly: 'M 100 150 Q 80 100 90 80 Q 100 50 130 40 Q 160 35 200 35 Q 240 35 270 40 Q 300 50 310 80 Q 320 100 300 150 Q 310 165 285 175 Q 275 180 250 182 L 150 182 Q 125 180 115 175 Q 90 165 100 150 Z',
                wavy: 'M 100 150 Q 80 100 90 80 Q 100 50 130 40 Q 160 35 200 35 Q 240 35 270 40 Q 300 50 310 80 Q 320 100 300 150 Q 310 168 280 175 Q 270 180 250 182 L 150 182 Q 130 180 120 175 Q 90 168 100 150 Z'
            }
        };

        // Color names mapping
        const colorNames = {
            '#654321': 'Brown',
            '#000000': 'Black',
            '#ffd700': 'Blonde',
            '#ff6b9d': 'Pink',
            '#9370db': 'Purple',
            '#00ced1': 'Cyan'
        };

        // Customer names pool
        const customerNames = [
            'Sarah', 'Emma', 'Olivia', 'Ava', 'Isabella', 'Sophia', 'Mia',
            'Charlotte', 'Amelia', 'Harper', 'Evelyn', 'Abigail', 'Emily', 'Luna'
        ];

        // Initialize
        function init() {
            updateAllVisuals();
            attachCharacterClickHandler();
        }

        // Sound functions
        function playSound(soundId) {
            if (!gameState.soundEnabled) return;
            const audio = document.getElementById(`audio-${soundId}`);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log('Audio play failed:', e));
            }
        }

        function toggleSound() {
            gameState.soundEnabled = !gameState.soundEnabled;
            const btn = document.getElementById('sound-toggle');
            btn.textContent = gameState.soundEnabled ? '🔊' : '🔇';

            const bgm = document.getElementById('audio-bgm');
            if (gameState.soundEnabled) {
                bgm.play().catch(e => console.log('BGM play failed:', e));
            } else {
                bgm.pause();
            }
        }

        // Tool selection
        function selectTool(tool, btn) {
            gameState.currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            playSound('click');
        }

        // Color selection
        function selectColor(color, btn) {
            pushState();
            gameState.color = color;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateAllVisuals();
            updateMood();
            playSound('spray');
            showMessage(`Hair dyed ${colorNames[color] || 'Custom'}! 🎨`);
        }

        // Attach click handler to character for tool use
        function attachCharacterClickHandler() {
            document.getElementById('character-container').addEventListener('click', useTool);
        }

        // Use current tool
        function useTool() {
            const tool = gameState.currentTool;

            switch(tool) {
                case 'scissors':
                    pushState();
                    const snipAmount = 5 + Math.floor(Math.random() * 6); // 5-10
                    gameState.hairLength = Math.max(0, gameState.hairLength - snipAmount);
                    updateAllVisuals();
                    updateMood();
                    playSound('snip');
                    showMessage(`Snipped ${snipAmount}% ✂️`);
                    break;

                case 'clippers':
                    pushState();
                    const buzzAmount = 20 + Math.floor(Math.random() * 11); // 20-30
                    gameState.hairLength = Math.max(0, gameState.hairLength - buzzAmount);
                    updateAllVisuals();
                    updateMood();
                    playSound('buzz');
                    showMessage(`Buzzed ${buzzAmount}% 🪒`);
                    break;

                case 'curler':
                    if (gameState.style === 'curly') {
                        showMessage('Hair is already curly! 🌀');
                        return;
                    }
                    pushState();
                    gameState.style = 'curly';
                    updateAllVisuals();
                    updateMood();
                    playSound('click');
                    showMessage('Hair is now curly! 🌀');
                    break;

                case 'straightener':
                    if (gameState.style === 'straight') {
                        showMessage('Hair is already straight! 📏');
                        return;
                    }
                    pushState();
                    gameState.style = 'straight';
                    updateAllVisuals();
                    updateMood();
                    playSound('click');
                    showMessage('Hair straightened! 📏');
                    break;

                case 'spray':
                    pushState();
                    updateAllVisuals();
                    playSound('spray');
                    showMessage('Hairspray applied! ✨');
                    break;
            }
        }

        // Update all visuals
        function updateAllVisuals() {
            updateHairVisual();
            updateLengthBar();
            updateStyleDisplay();
            updateColorDisplay();
        }

        // Update hair visual based on length and style
        function updateHairVisual() {
            const length = gameState.hairLength;
            const style = gameState.style;

            let lengthCategory;
            if (length > 70) lengthCategory = 'long';
            else if (length > 40) lengthCategory = 'medium';
            else if (length > 15) lengthCategory = 'bob';
            else lengthCategory = 'short';

            const hairPath = document.getElementById('hair-path');
            const hairShine = document.getElementById('hair-shine');

            if (hairPath && hairStyles[lengthCategory] && hairStyles[lengthCategory][style]) {
                hairPath.setAttribute('d', hairStyles[lengthCategory][style]);
                hairPath.setAttribute('fill', gameState.color);

                // Adjust shine position based on length
                if (hairShine) {
                    const shineY = lengthCategory === 'long' ? 100 : lengthCategory === 'medium' ? 90 : 80;
                    hairShine.setAttribute('cy', shineY);
                }
            }
        }

        // Update length progress bar
        function updateLengthBar() {
            const bar = document.getElementById('length-progress');
            const length = Math.round(gameState.hairLength);
            bar.style.width = `${length}%`;
            bar.textContent = `${length}%`;
        }

        // Update style display
        function updateStyleDisplay() {
            const display = document.getElementById('style-display');
            const style = gameState.style.charAt(0).toUpperCase() + gameState.style.slice(1);
            const emoji = gameState.style === 'curly' ? '🌀' : '📏';
            display.textContent = `${style} ${emoji}`;
        }

        // Update color display
        function updateColorDisplay() {
            const display = document.getElementById('color-display');
            const colorName = colorNames[gameState.color] || 'Custom';
            display.textContent = colorName;
            display.style.background = `linear-gradient(135deg, ${gameState.color}, ${gameState.color}dd)`;
            display.style.color = isColorDark(gameState.color) ? 'white' : 'black';
        }

        // Check if color is dark
        function isColorDark(hex) {
            const r = parseInt(hex.substr(1, 2), 16);
            const g = parseInt(hex.substr(3, 2), 16);
            const b = parseInt(hex.substr(5, 2), 16);
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            return brightness < 128;
        }

        // Update customer mood
        function updateMood() {
            const length = gameState.hairLength;
            const targetCenter = (gameState.targetMin + gameState.targetMax) / 2;
            const targetRange = gameState.targetMax - gameState.targetMin;
            const lengthDiff = Math.abs(length - targetCenter);

            let mood = 50;

            if (lengthDiff < targetRange / 2) {
                mood = 90; // Perfect!
            } else if (lengthDiff < targetRange) {
                mood = 70; // Good
            } else if (lengthDiff < targetRange * 1.5) {
                mood = 50; // Okay
            } else {
                mood = 30; // Not happy
            }

            gameState.customerMood = mood;

            // Update mood emoji
            const moodDisplay = document.getElementById('mood-display');
            if (mood >= 80) {
                moodDisplay.textContent = '😍';
            } else if (mood >= 60) {
                moodDisplay.textContent = '😊';
            } else if (mood >= 40) {
                moodDisplay.textContent = '😐';
            } else {
                moodDisplay.textContent = '😟';
            }

            // Update mouth
            const mouth = document.getElementById('mouth');
            if (mood >= 70) {
                mouth.setAttribute('d', 'M 180 245 Q 200 255 220 245'); // Smile
            } else if (mood >= 40) {
                mouth.setAttribute('d', 'M 180 250 L 220 250'); // Neutral
            } else {
                mouth.setAttribute('d', 'M 180 255 Q 200 245 220 255'); // Frown
            }
        }

        // Show message
        function showMessage(msg) {
            const msgArea = document.getElementById('message-area');
            msgArea.textContent = msg;
            msgArea.classList.add('show');
            setTimeout(() => {
                msgArea.classList.remove('show');
            }, 2000);
        }

        // State management
        function pushState() {
            const snapshot = {
                hairLength: gameState.hairLength,
                style: gameState.style,
                color: gameState.color
            };
            gameState.history.push(snapshot);
            if (gameState.history.length > gameState.maxHistorySize) {
                gameState.history.shift();
            }
        }

        function popState() {
            if (gameState.history.length === 0) return false;
            const prev = gameState.history.pop();
            gameState.hairLength = prev.hairLength;
            gameState.style = prev.style;
            gameState.color = prev.color;
            return true;
        }

        // Actions
        function undoAction() {
            if (popState()) {
                updateAllVisuals();
                updateMood();
                playSound('click');
                showMessage('Undo! ↩️');
            } else {
                showMessage('Nothing to undo!');
            }
        }

        function resetHair() {
            pushState();
            gameState.hairLength = 100;
            gameState.style = 'straight';
            gameState.color = '#654321';
            updateAllVisuals();
            updateMood();
            playSound('click');
            showMessage('Hair reset! 🔄');
        }

        // Finish and show results
        function finishAndShow() {
            playSound('success');

            const length = gameState.hairLength;
            const targetMin = gameState.targetMin;
            const targetMax = gameState.targetMax;
            const targetCenter = (targetMin + targetMax) / 2;
            const lengthDiff = Math.abs(length - targetCenter);

            let stars = 0;
            let message = '';

            if (length >= targetMin && length <= targetMax) {
                stars = 5;
                message = "Perfect! The customer is absolutely thrilled! 🎉 They leave a huge tip and promise to tell all their friends about you!";
            } else if (lengthDiff < 15) {
                stars = 4;
                message = "Great job! The customer loves it! 😊 They're very happy with the result and will definitely come back!";
            } else if (lengthDiff < 30) {
                stars = 3;
                message = "Not bad! The customer is satisfied. 😐 It's not exactly what they wanted, but they're okay with it.";
            } else if (length < targetMin - 30) {
                stars = 2;
                message = "Oops! You cut it WAY too short! 😰 The customer tries to smile, but you can see the tears forming...";
            } else if (length > targetMax + 30) {
                stars = 2;
                message = "Um... they wanted it shorter. 😕 The customer politely says 'it's fine' but you know they're disappointed.";
            } else {
                stars = 1;
                message = "Oh no! The customer is clearly unhappy. 😢 They're trying to be polite, but you can tell this isn't what they wanted at all.";
            }

            // Show results
            document.getElementById('stars-display').textContent = '⭐'.repeat(stars) + '☆'.repeat(5 - stars);
            document.getElementById('results-message').textContent = message;
            document.getElementById('results-modal').classList.add('show');
        }

        // Next customer
        function nextCustomer() {
            document.getElementById('results-modal').classList.remove('show');

            // Reset state
            gameState.customerIndex++;
            gameState.hairLength = 100;
            gameState.style = 'straight';
            gameState.color = '#654321';
            gameState.history = [];

            // Random target
            gameState.targetMin = 20 + Math.floor(Math.random() * 40);
            gameState.targetMax = gameState.targetMin + 20 + Math.floor(Math.random() * 30);

            // Update customer info
            const name = customerNames[Math.floor(Math.random() * customerNames.length)];
            document.getElementById('customer-name').textContent = `${name} - Customer #${gameState.customerIndex}`;
            document.getElementById('customer-request').textContent = `Wants: ${gameState.targetMin}-${gameState.targetMax}% length`;

            // Reset visuals
            updateAllVisuals();
            updateMood();

            playSound('click');
            showMessage(`Welcome ${name}! 👋`);
        }

        // Start on load
        window.addEventListener('load', init);
    </script>
</body>
</html>
