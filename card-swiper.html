<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Swiper - Interactive Photo Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 500px;
            height: 700px;
            position: relative;
            perspective: 1000px;
        }

        .instructions {
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            font-size: 16px;
            opacity: 0.9;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .card-stack {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            overflow: hidden;
            cursor: grab;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        opacity 0.3s ease,
                        box-shadow 0.3s ease,
                        filter 0.3s ease;
            will-change: transform, opacity;
        }

        .card.dragging {
            cursor: grabbing;
            transition: none;
        }

        .card.animating {
            pointer-events: none;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            overflow: hidden;
            background: #fff;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
            z-index: 1;
        }

        .card-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 32px;
            z-index: 2;
            color: white;
        }

        .card-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .card-description {
            font-size: 16px;
            opacity: 0.95;
            line-height: 1.5;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        /* Stack depth effect */
        .card[data-index="0"] {
            z-index: 4;
            transform: translateY(0) scale(1);
            opacity: 1;
            filter: blur(0px);
        }

        .card[data-index="1"] {
            z-index: 3;
            transform: translateY(20px) scale(0.95);
            opacity: 0.7;
            pointer-events: none;
            filter: blur(2px);
        }

        .card[data-index="2"] {
            z-index: 2;
            transform: translateY(40px) scale(0.9);
            opacity: 0.4;
            pointer-events: none;
            filter: blur(4px);
        }

        .card[data-index="3"] {
            z-index: 1;
            transform: translateY(60px) scale(0.85);
            opacity: 0.2;
            pointer-events: none;
            filter: blur(6px);
        }

        /* Glow effects based on card theme colors */
        .card[data-index="0"][data-theme="coral"] {
            box-shadow: 0 30px 80px -10px rgba(255, 127, 80, 0.6),
                        0 20px 40px -10px rgba(255, 99, 71, 0.4),
                        0 10px 20px -5px rgba(255, 160, 122, 0.3);
        }

        .card[data-index="0"][data-theme="ocean"] {
            box-shadow: 0 30px 80px -10px rgba(64, 156, 255, 0.6),
                        0 20px 40px -10px rgba(30, 144, 255, 0.4),
                        0 10px 20px -5px rgba(135, 206, 250, 0.3);
        }

        .card[data-index="0"][data-theme="sunset"] {
            box-shadow: 0 30px 80px -10px rgba(255, 107, 107, 0.6),
                        0 20px 40px -10px rgba(255, 121, 63, 0.4),
                        0 10px 20px -5px rgba(255, 177, 66, 0.3);
        }

        .card[data-index="0"][data-theme="nature"] {
            box-shadow: 0 30px 80px -10px rgba(46, 213, 115, 0.6),
                        0 20px 40px -10px rgba(0, 184, 148, 0.4),
                        0 10px 20px -5px rgba(85, 230, 193, 0.3);
        }

        /* Swipe indicators */
        .swipe-indicator {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 48px;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
            z-index: 5;
        }

        .swipe-indicator.left {
            left: 40px;
        }

        .swipe-indicator.right {
            right: 40px;
        }

        .swipe-indicator.visible {
            opacity: 1;
        }

        /* Counter */
        .counter {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            font-weight: 600;
            opacity: 0.8;
            display: flex;
            gap: 12px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }

        .dot.active {
            background: white;
            transform: scale(1.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="instructions">
            ← Drag left to dismiss • Drag right to go back →
        </div>

        <div class="card-stack" id="cardStack">
            <!-- Cards will be dynamically generated -->
        </div>

        <div class="counter" id="counter">
            <!-- Dots will be dynamically generated -->
        </div>
    </div>

    <script>
        // Card data with Unsplash photos and theme colors
        const cardData = [
            {
                image: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800&h=1000&fit=crop',
                title: 'Coastal Vibes',
                description: 'Discover the serene beauty of ocean life',
                theme: 'ocean',
                bgColor: '#409cff'
            },
            {
                image: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=800&h=1000&fit=crop',
                title: 'Golden Hour',
                description: 'Embrace the warmth of sunset moments',
                theme: 'sunset',
                bgColor: '#ff6b6b'
            },
            {
                image: 'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=800&h=1000&fit=crop',
                title: 'Urban Explorer',
                description: 'Navigate through city adventures',
                theme: 'coral',
                bgColor: '#ff7f50'
            },
            {
                image: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=800&h=1000&fit=crop',
                title: 'Natural Beauty',
                description: 'Connect with the essence of nature',
                theme: 'nature',
                bgColor: '#2ed573'
            }
        ];

        class CardSwiper {
            constructor() {
                this.cards = [];
                this.currentIndex = 0;
                this.history = [];
                this.isDragging = false;
                this.startX = 0;
                this.currentX = 0;
                this.dragThreshold = 100; // pixels to trigger dismiss
                this.activeCard = null;

                this.init();
            }

            init() {
                this.createCards();
                this.updateCardPositions();
                this.createCounter();
                this.attachEventListeners();
            }

            createCards() {
                const stack = document.getElementById('cardStack');

                cardData.forEach((data, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.dataset.theme = data.theme;
                    card.dataset.originalIndex = index;

                    card.innerHTML = `
                        <div class="card-inner">
                            <img src="${data.image}" alt="${data.title}" class="card-image">
                            <div class="card-gradient"></div>
                            <div class="card-content">
                                <h2 class="card-title">${data.title}</h2>
                                <p class="card-description">${data.description}</p>
                            </div>
                        </div>
                        <div class="swipe-indicator left">❌</div>
                        <div class="swipe-indicator right">↩️</div>
                    `;

                    stack.appendChild(card);
                    this.cards.push(card);
                });
            }

            createCounter() {
                const counter = document.getElementById('counter');
                cardData.forEach((_, index) => {
                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    if (index === 0) dot.classList.add('active');
                    counter.appendChild(dot);
                });
            }

            updateCounter() {
                const dots = document.querySelectorAll('.dot');
                dots.forEach((dot, index) => {
                    dot.classList.toggle('active', index === this.currentIndex);
                });
            }

            updateCardPositions() {
                this.cards.forEach((card, index) => {
                    const visualIndex = (index - this.currentIndex + this.cards.length) % this.cards.length;
                    card.dataset.index = visualIndex;

                    if (visualIndex > 3) {
                        card.style.display = 'none';
                    } else {
                        card.style.display = 'block';
                    }
                });
            }

            attachEventListeners() {
                this.cards.forEach(card => {
                    card.addEventListener('mousedown', (e) => this.onDragStart(e, card));
                    card.addEventListener('touchstart', (e) => this.onDragStart(e, card), { passive: false });
                });

                document.addEventListener('mousemove', (e) => this.onDragMove(e));
                document.addEventListener('touchmove', (e) => this.onDragMove(e), { passive: false });

                document.addEventListener('mouseup', (e) => this.onDragEnd(e));
                document.addEventListener('touchend', (e) => this.onDragEnd(e));
            }

            onDragStart(e, card) {
                if (card.dataset.index !== '0') return;

                this.isDragging = true;
                this.activeCard = card;
                this.activeCard.classList.add('dragging');

                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                this.startX = clientX;
                this.currentX = clientX;
            }

            onDragMove(e) {
                if (!this.isDragging || !this.activeCard) return;

                e.preventDefault();

                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                this.currentX = clientX;
                const deltaX = this.currentX - this.startX;

                // Apply transform
                const rotation = deltaX * 0.1; // Subtle rotation
                const opacity = 1 - Math.abs(deltaX) / 500;

                this.activeCard.style.transform = `translateX(${deltaX}px) rotate(${rotation}deg)`;
                this.activeCard.style.opacity = Math.max(0.3, opacity);

                // Show appropriate indicator
                const leftIndicator = this.activeCard.querySelector('.swipe-indicator.left');
                const rightIndicator = this.activeCard.querySelector('.swipe-indicator.right');

                if (deltaX < -this.dragThreshold) {
                    leftIndicator.classList.add('visible');
                    rightIndicator.classList.remove('visible');
                } else if (deltaX > this.dragThreshold && this.history.length > 0) {
                    rightIndicator.classList.add('visible');
                    leftIndicator.classList.remove('visible');
                } else {
                    leftIndicator.classList.remove('visible');
                    rightIndicator.classList.remove('visible');
                }
            }

            onDragEnd(e) {
                if (!this.isDragging || !this.activeCard) return;

                this.isDragging = false;
                const deltaX = this.currentX - this.startX;

                // Clear indicators
                const leftIndicator = this.activeCard.querySelector('.swipe-indicator.left');
                const rightIndicator = this.activeCard.querySelector('.swipe-indicator.right');
                leftIndicator.classList.remove('visible');
                rightIndicator.classList.remove('visible');

                // Determine action based on threshold
                if (deltaX < -this.dragThreshold) {
                    // Swipe left - dismiss card
                    this.dismissCard('left');
                } else if (deltaX > this.dragThreshold && this.history.length > 0) {
                    // Swipe right - go back
                    this.goBack();
                } else {
                    // Snap back
                    this.snapBack();
                }
            }

            dismissCard(direction) {
                this.activeCard.classList.add('animating');

                const targetX = direction === 'left' ? -window.innerWidth : window.innerWidth;
                this.activeCard.style.transform = `translateX(${targetX}px) rotate(${direction === 'left' ? -30 : 30}deg)`;
                this.activeCard.style.opacity = '0';

                // Save to history
                this.history.push(this.currentIndex);

                setTimeout(() => {
                    this.currentIndex = (this.currentIndex + 1) % this.cards.length;
                    this.updateCardPositions();
                    this.updateCounter();

                    // Reset the dismissed card
                    this.activeCard.style.transform = '';
                    this.activeCard.style.opacity = '';
                    this.activeCard.classList.remove('dragging', 'animating');
                    this.activeCard = null;
                }, 300);
            }

            goBack() {
                if (this.history.length === 0) {
                    this.snapBack();
                    return;
                }

                this.activeCard.classList.add('animating');
                this.activeCard.style.transform = `translateX(${window.innerWidth}px) rotate(30deg)`;
                this.activeCard.style.opacity = '0';

                setTimeout(() => {
                    this.currentIndex = this.history.pop();
                    this.updateCardPositions();
                    this.updateCounter();

                    this.activeCard.style.transform = '';
                    this.activeCard.style.opacity = '';
                    this.activeCard.classList.remove('dragging', 'animating');
                    this.activeCard = null;
                }, 300);
            }

            snapBack() {
                this.activeCard.classList.add('animating');
                this.activeCard.style.transform = '';
                this.activeCard.style.opacity = '';

                setTimeout(() => {
                    this.activeCard.classList.remove('dragging', 'animating');
                    this.activeCard = null;
                }, 300);
            }
        }

        // Initialize the card swiper
        new CardSwiper();
    </script>
</body>
</html>
